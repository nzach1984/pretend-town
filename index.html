function viewModal() {
  if (S.pin) {
    const d = S.pin.digits;
    return `<div class="overlay"><div class="dialog"><h3 style="text-align:center">${S.pin.target === 'bank' ? 'Banker PIN' : 'Hi ' + esc(nameOf(S.pin.target)) + ', enter your PIN'}</h3>
      <div class="dots">${[0, 1, 2, 3].map(i => `<i class="${i < d.length ? 'on' : ''}"></i>`).join('')}</div>
      ${S.pin.wrong ? '<p class="neg" style="text-align:center">That’s not it. Try again.</p>' : ''}
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-act="digit" data-id="${n}">${n}</button>`).join('')}<button data-act="pinCancel" style="font-size:1rem">Cancel</button><button data-act="digit" data-id="0">0</button><button data-act="digitBack" style="font-size:1rem">Delete</button></div></div></div>`;
  }
  if (S.modal) return `<div class="overlay"><div class="dialog"><h3>${esc(S.modal.title)}</h3><p class="muted">${esc(S.modal.body)}</p>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="modalNo">Cancel</button><button class="btn ${S.modal.danger ? 'danger' : 'gold'}" data-act="modalYes">${esc(S.modal.ok)}</button></div></div></div>`;
  return '';
}
const confirmIt = (title, body, ok, fn, danger) => { S.modal = {title, body, ok, fn, danger}; render(); };

// ---------- actions ----------
function enter(target) {
  S.pin = null; S.me = target; S.tab = null; S.thread = null;
  if (target !== 'bank') ls('ptb.me', target); else ls('ptb.me', null);
  window.scrollTo(0, 0); render();
}
const acts = {
  pick: id => { const p = S.players[id]; if (p?.pin) { S.pin = {target: id, digits: ''}; render(); } else enter(id); },
  pickBank: () => { if (S.settings.bankerPin) { S.pin = {target: 'bank', digits: ''}; render(); } else enter('bank'); },
  digit: d => {
    const P = S.pin; if (!P || P.digits.length >= 4) return;
    P.digits += d; P.wrong = false;
    if (P.digits.length === 4) {
      const want = P.target === 'bank' ? S.settings.bankerPin : S.players[P.target]?.pin;
      if (P.digits === String(want)) return enter(P.target);
      P.digits = ''; P.wrong = true;
    }
    render();
  },
  digitBack: () => { if (S.pin) { S.pin.digits = S.pin.digits.slice(0, -1); render(); } },
  pinCancel: () => { S.pin = null; render(); },
  switch: () => { S.me = null; S.thread = null; ls('ptb.me', null); render(); },
  openThread: id => { S.thread = id; markRead(id); render(); setTimeout(() => document.getElementById('msg-text')?.focus(), 50); },
  closeThread: () => { S.thread = null; render(); },
  tab: id => { S.tab = id; window.scrollTo(0, 0); render(); },
  modalNo: () => { S.modal = null; render(); },
  modalYes: () => { const f = S.modal?.fn; S.modal = null; render(); if (f) run(f); },
  advance: () => {
    const d = today() + 1;
    confirmIt(`Advance to Day ${d}?`, 'Everything scheduled for that day runs now: paydays, bills, rent, interest, CDs and late fees, plus maybe a town event. This can’t be undone.', `Start Day ${d}`, async () => {
      const patch = {}, done = [];
      const late = await markLate(d); if (late) done.push(late);
      const cd = await doCds(d); if (cd) done.push(cd);
      if (d % every('payEvery') === 0) { const r = await doPayday(patch); if (r) done.push(r); }
      if (d % every('billEvery') === 0) { const r = await doUtilities(d); if (r) done.push(r); }
      if (d % every('rentEvery') === 0) { const r = await doHousing(d); if (r) done.push(r); }
      if (d % every('interestEvery') === 0) { const r = await doInterest(patch); if (r) done.push(r); }
      if (Math.random() * 100 < cfg('eventChance')) { const r = await drawEvent(d, patch); if (r) done.push(r); }
      patch.day = d;
      await db.doc('town/settings').update(patch);
      toast(`Good morning, Day ${d}!` + (done.length ? ' ' + done.join(', ') + '.' : ''));
    });
  },
  runNow: what => {
    const label = {pay: 'Run a payday now?', bills: 'Send utility bills now?', interest: 'Run interest now?', event: 'Draw a town event card?'}[what];
    confirmIt(label, 'This happens right away and doesn’t change the day or the schedule.', 'Do it', async () => {
      const patch = {};
      if (what === 'pay') { if (!(await doPayday(patch))) fail('Nobody has a wage yet.'); }
      if (what === 'bills') { if (!(await doUtilities(today()))) fail('Add residents and utility amounts first.'); }
      if (what === 'interest') await doInterest(patch);
      if (what === 'event') { if (!(await drawEvent(today(), patch))) fail('Add residents first.'); }
      if (Object.keys(patch).length) await db.doc('town/settings').update(patch);
      toast(what === 'event' ? patch.event.title + ': ' + patch.event.text : 'Done');
    });
  },
  payBill: id => run(async () => {
    const x = S.bills.find(y => y.id === id); if (!x || (x.status !== 'due' && x.status !== 'late')) fail('That bill is already paid.');
    if (bal(balances(), S.me, 'c') < x.total) fail(`Not enough in checking. You need ${money(x.total)}.`);
    await addTx(S.me + '.c', 'bank', x.total, x.kind === 'rent' || x.kind === 'mortgage' ? 'rent' : 'bill', `${x.label || 'Utilities'} bill from Day ${x.issuedDay}` + (x.status === 'late' ? ' (late)' : ''));
    await db.doc('bills/' + id).update({status: x.status === 'late' ? 'paidLate' : 'paid', paidDay: today(), paidAt: Date.now()});
    let extra = '';
    const h = S.players[S.me]?.home;
    if (x.kind === 'mortgage' && h && h.mode === 'mortgage') {
      const interest = Math.round(h.balance * h.rate / 100), principal = Math.max(0, (x.base || 0) - interest), left = Math.max(0, h.balance - principal);
      await db.doc('players/' + S.me).update({home: {...h, balance: left, mode: left <= 0 ? 'own' : 'mortgage'}});
      extra = left <= 0 ? ' You own your home now!' : ` ${money(principal)} went toward your home.`;
    }
    toast((x.status === 'late' ? 'Bill paid. Try to pay on time next time.' : 'Bill paid on time. Your credit score went up.') + extra);
  }),
  buy: id => run(async () => {
    const it = S.items[id]; if (!it) fail('That item is gone.');
    const shop = S.shops[it.shopId]; if (!shop) fail('That business closed.');
    const isR = bizType(shop) === 'restaurant', pct = salePct(shop), unit = priceNow(it, shop);
    const qty = parseInt(val('q-' + id), 10); if (!(qty >= 1)) fail('Choose how many.');
    if (it.stock != null && it.stock < qty) fail(`Only ${it.stock} left.`);
    const sub = unit * qty, tipPct = isR ? (parseFloat(val('tip-' + shop.id)) || 0) : 0, tip = Math.round(sub * tipPct / 100), total = sub + tip;
    if (bal(balances(), S.me, 'c') < total) fail(`Not enough in checking. You need ${money(total)}.`);
    await addTx(S.me + '.c', shop.ownerId + '.c', total, isR ? 'meal' : 'purchase', `${qty} × ${it.name} at ${shop.name}` + (pct ? ` (${pct}% off)` : '') + (tip ? ` + ${money(tip)} tip` : ''));
    if (it.stock != null) await db.doc('items/' + id).update({stock: it.stock - qty});
    await db.collection('orders').add({shopId: shop.id, bizType: bizType(shop), itemId: id, itemName: it.name, qty, price: unit, salePct: pct, tip, total, buyerId: S.me, sellerId: shop.ownerId, status: 'new', day: today(), at: Date.now()});
    clear('q-' + id); toast(`Ordered ${qty} × ${it.name}` + (pct ? ` and saved ${money((it.price - unit) * qty)}` : ''));
  }),
  endSale: id => run(async () => { await db.doc('shops/' + id).update({sale: null}); toast('Sale ended'); }),
  deliver: id => run(async () => { const o = S.orders.find(x => x.id === id); await db.doc('orders/' + id).update({status: 'done'}); toast(o?.bizType === 'restaurant' ? 'Marked served' : 'Marked delivered'); }),
  refund: id => {
    const o = S.orders.find(x => x.id === id); if (!o) return;
    confirmIt('Refund this order?', `${money(o.total)} goes back to ${nameOf(o.buyerId)} from your checking.`, 'Refund', async () => {
      if (bal(balances(), o.sellerId, 'c') < o.total) fail('Not enough in your checking to refund.');
      await addTx(o.sellerId + '.c', o.buyerId + '.c', o.total, 'refund', `Refund: ${o.qty} × ${o.itemName}`);
      await db.doc('orders/' + id).update({status: 'refunded'});
      const it = S.items[o.itemId]; if (it && it.stock != null) await db.doc('items/' + o.itemId).update({stock: it.stock + o.qty});
      toast('Refunded');
    });
  },
  removeItem: id => confirmIt('Remove this?', `${S.items[id]?.name || 'It'} will come off the list.`, 'Remove', async () => { await db.doc('items/' + id).delete(); }, true),
  closeShop: id => confirmIt(`Close ${S.shops[id]?.name || 'this business'}?`, 'Its items come off Main Street. Past sales stay in the records, and investors keep their shares.', 'Close it', async () => {
    for (const i of Object.values(S.items).filter(i => i.shopId === id)) await db.doc('items/' + i.id).delete();
    await db.doc('shops/' + id).delete(); toast('Closed');
  }, true),
  buyStock: shopId => run(async () => {
    const shop = S.shops[shopId]; if (!shop) fail('That business closed.');
    if (shop.ownerId === S.me) fail('You can’t buy shares in your own business.');
    const n = parseInt(val('sb-' + shopId), 10); if (!(n >= 1)) fail('Choose how many shares.');
    const left = SHARES - sharesOut(shopId); if (n > left) fail(`Only ${left} share${left === 1 ? '' : 's'} left.`);
    const pr = sharePrice(shopId), cost = pr * n;
    if (bal(balances(), S.me, 'c') < cost) fail(`Not enough in checking. ${n} share${n > 1 ? 's' : ''} cost ${money(cost)}.`);
    await addTx(S.me + '.c', 'bank', cost, 'stock', `Bought ${n} share${n > 1 ? 's' : ''} of ${shop.name} at ${money(pr)}`);
    const hid = S.me + '_' + shopId, h = S.holdings.find(x => x.id === hid);
    await db.doc('holdings/' + hid).set({playerId: S.me, shopId, shares: (h?.shares || 0) + n, cost: (h?.cost || 0) + cost});
    clear('sb-' + shopId); toast(`You own ${(h?.shares || 0) + n} share${(h?.shares || 0) + n > 1 ? 's' : ''} of ${shop.name}`);
  }),
  sellStock: shopId => run(async () => {
    const hid = S.me + '_' + shopId, h = S.holdings.find(x => x.id === hid); if (!h || !h.shares) fail('You don’t own any.');
    const n = parseInt(val('ss-' + shopId), 10); if (!(n >= 1 && n <= h.shares)) fail(`Choose 1 to ${h.shares} shares.`);
    const pr = sharePrice(shopId), got = pr * n, costPart = Math.round((h.cost || 0) * n / h.shares);
    await addTx('bank', S.me + '.c', got, 'stock', `Sold ${n} share${n > 1 ? 's' : ''} of ${S.shops[shopId]?.name || 'a closed business'} at ${money(pr)}`);
    await db.doc('holdings/' + hid).set({playerId: S.me, shopId, shares: h.shares - n, cost: Math.max(0, (h.cost || 0) - costPart)});
    clear('ss-' + shopId);
    toast(got >= costPart ? `Sold for a ${money(got - costPart)} profit` : `Sold at a ${money(costPart - got)} loss`);
  }),
  rentHome: i => {
    const x = homes()[i]; if (!x) return;
    confirmIt(`Rent the ${x.name}?`, `You pay ${money(x.rent)} now to move in, then ${money(x.rent)} every ${every('rentEvery')} days.`, 'Move in', async () => {
      if (S.players[S.me]?.home) fail('Move out of your current home first.');
      if (bal(balances(), S.me, 'c') < x.rent) fail(`You need ${money(x.rent)} in checking to move in.`);
      await addTx(S.me + '.c', 'bank', x.rent, 'rent', `First rent · ${x.name}`);
      await db.doc('players/' + S.me).update({home: {name: x.name, mode: 'rent', rent: x.rent, price: x.price}});
      toast(`Welcome home to your ${x.name}!`);
    });
  },
  buyCash: i => {
    const x = homes()[i]; if (!x) return;
    confirmIt(`Buy the ${x.name} with cash?`, `${money(x.price)} comes out of checking. You’ll never pay rent or a mortgage on it.`, 'Buy it', async () => {
      if (S.players[S.me]?.home) fail('Move out of your current home first.');
      if (bal(balances(), S.me, 'c') < x.price) fail(`You need ${money(x.price)} in checking. Try a mortgage instead.`);
      await addTx(S.me + '.c', 'bank', x.price, 'home', `Bought the ${x.name}`);
      await db.doc('players/' + S.me).update({home: {name: x.name, mode: 'own', rent: x.rent, price: x.price}});
      toast(`You own the ${x.name}!`);
    });
  },
  applyMortgage: i => run(async () => {
    const x = homes()[i]; if (!x) fail('That home is gone.');
    if (S.players[S.me]?.home) fail('Move out of your current home first.');
    if (tellerOf(S.me).some(t => t.kind === 'mortgage' && t.status === 'waiting')) fail('You already have a mortgage application waiting.');
    const down = Math.round(x.price * cfg('downPct') / 100);
    if (bal(balances(), S.me, 'c') < down) fail(`You need ${money(down)} in checking for the down payment.`);
    await db.collection('teller').add({playerId: S.me, kind: 'mortgage', homeIdx: Number(i), amount: x.price, status: 'waiting', day: today(), at: Date.now()});
    toast('Application sent. Go see the banker!');
  }),
  moveOut: () => {
    const h = S.players[S.me]?.home; if (!h) return;
    const body = h.mode === 'rent' ? 'You’ll stop paying rent and need a new place to live.'
      : h.mode === 'own' ? `The bank buys your home for ${money(h.price)}.`
      : `The bank buys your home for ${money(h.price)} and keeps ${money(h.balance)} to pay off the mortgage, so you get ${money(h.price - h.balance)}.`;
    confirmIt(h.mode === 'rent' ? 'Move out?' : 'Sell your home?', body, h.mode === 'rent' ? 'Move out' : 'Sell it', async () => {
      if (h.mode === 'own') await addTx('bank', S.me + '.c', h.price, 'home', `Sold the ${h.name}`);
      if (h.mode === 'mortgage') { const net = h.price - h.balance; if (net > 0) await addTx('bank', S.me + '.c', net, 'home', `Sold the ${h.name} and paid off the mortgage`); if (net < 0) await addTx(S.me + '.c', 'bank', -net, 'home', `Sold the ${h.name}; mortgage was more than the price`); }
      await db.doc('players/' + S.me).update({home: null});
      toast('Moved out');
    }, true);
  },
  cdEarly: id => run(async () => {
    if (S.teller.some(t => t.cdId === id && t.status === 'waiting')) fail('That request is already waiting at the teller window.');
    const c = S.cds.find(x => x.id === id); if (!c || c.status !== 'open') fail('That CD is closed.');
    await db.collection('teller').add({playerId: S.me, kind: 'cdclose', cdId: id, amount: c.amount, status: 'waiting', day: today(), at: Date.now()});
    toast('Request sent. Go see the banker.');
  }),
  cancelTeller: id => run(async () => { await db.doc('teller/' + id).update({status: 'declined'}); toast('Request canceled'); }),
  tellerDecline: id => run(async () => { await db.doc('teller/' + id).update({status: 'declined'}); toast('Declined'); }),
  tellerDone: id => run(async () => {
    const r = S.teller.find(x => x.id === id); if (!r || r.status !== 'waiting') fail('That request is already handled.');
    const pid = r.playerId, c = bal(balances(), pid, 'c'), who = nameOf(pid);
    if (r.kind === 'withdraw') { if (c < r.amount) fail(`${who} only has ${money(c)} in checking.`); await addTx(pid + '.c', 'bank', r.amount, 'cash', 'Cash withdrawal at the teller window'); }
    if (r.kind === 'deposit') await addTx('bank', pid + '.' + (r.acct === 's' ? 's' : 'c'), r.amount, 'cash', 'Cash deposit at the teller window');
    if (r.kind === 'cd') {
      if (c < r.amount) fail(`${who} only has ${money(c)} in checking.`);
      const payout = Math.round(r.amount * (100 + cfg('cdRate')) / 100);
      await addTx(pid + '.c', 'bank', r.amount, 'cd', `Opened a CD: ${money(r.amount)} for ${every('cdDays')} days`);
      await db.collection('cds').add({playerId: pid, amount: r.amount, rate: cfg('cdRate'), payout, openDay: today(), matureDay: today() + every('cdDays'), status: 'open', at: Date.now()});
    }
    if (r.kind === 'cdclose') {
      const cd = S.cds.find(x => x.id === r.cdId); if (!cd || cd.status !== 'open') fail('That CD is already closed.');
      const back = Math.round(cd.amount * (100 - cfg('cdPenalty')) / 100);
      await addTx('bank', pid + '.c', back, 'cd', `Cashed out a CD early (${cfg('cdPenalty')}% penalty)`);
      await db.doc('cds/' + cd.id).update({status: 'closed'});
    }
    if (r.kind === 'mortgage') {
      const x = homes()[r.homeIdx]; if (!x) fail('That home no longer exists in Settings.');
      if (S.players[pid]?.home) fail(`${who} already has a home.`);
      const down = Math.round(x.price * cfg('downPct') / 100), P = x.price - down;
      if (c < down) fail(`${who} needs ${money(down)} in checking for the down payment.`);
      await addTx(pid + '.c', 'bank', down, 'home', `Down payment on the ${x.name}`);
      await db.doc('players/' + pid).update({home: {name: x.name, mode: P > 0 ? 'mortgage' : 'own', rent: x.rent, price: x.price, balance: P, rate: cfg('mortgageRate'), payment: mortgagePayment(P, cfg('mortgageRate'), every('mortgageTerm'))}});
    }
    await db.doc('teller/' + id).update({status: 'done', doneDay: today()});
    toast({withdraw: `Handed ${who} ${money(r.amount)} in cash`, deposit: `Deposited ${money(r.amount)} for ${who}`, cd: `CD opened for ${who}`, cdclose: `CD cashed out for ${who}`, mortgage: `Mortgage approved. ${who} has a new home!`}[r.kind]);
  }),
  decline: id => run(async () => { await db.doc('loans/' + id).update({status: 'declined'}); toast('Loan declined'); }),
  missed: id => confirmIt('Record a missed payment?', `This lowers ${nameOf(S.loans[id]?.playerId)}'s credit score by 60 points.`, 'Record it', async () => {
    await db.doc('loans/' + id).update({missed: (S.loans[id].missed || 0) + 1}); toast('Missed payment recorded');
  }, true),
  delPlayer: id => confirmIt(`Remove ${nameOf(id)}?`, 'They leave town. Their past transactions stay in the ledger.', 'Remove', async () => {
    await db.doc('players/' + id).delete(); toast('Resident removed');
  }, true),
};

const forms = {
  setup: async () => {
    const pin = val('su-pin'); if (!/^\d{4}$/.test(pin)) fail('The banker PIN needs 4 digits.');
    await db.doc('town/settings').set({name: val('su-name').trim(), symbol: val('su-sym').trim() || '$', bankerPin: pin, ...DEFAULTS, utilities: DEFAULT_UTIL, homes: DEFAULT_HOMES, paydays: 0, createdAt: Date.now()});
    S.me = 'bank'; S.tab = 'people'; toast('Your bank is open. Add your residents.');
  },
  check: async () => {
    const to = val('ck-to'), amt = toCents(val('ck-amt'));
    if (!S.players[to]) fail('Choose who to pay.');
    if (!(amt > 0)) fail('Write an amount bigger than zero.');
    if (bal(balances(), S.me, 'c') < amt) fail('Not enough in checking for that check.');
    await addTx(S.me + '.c', to + '.c', amt, 'check', val('ck-memo').trim() || 'Check to ' + nameOf(to));
    clear('ck-to', 'ck-amt', 'ck-memo'); toast(`Check sent to ${nameOf(to)}`);
  },
  sendMsg: async to => {
    const t = val('msg-text').trim(); if (!t) fail('Type a message first.');
    if (to !== 'board' && to !== 'bank' && !S.players[to]) fail('That person left town.');
    await db.collection('messages').add({from: S.me, to, text: t.slice(0, 300), day: today(), at: Date.now()});
    clear('msg-text');
  },
  move: async () => {
    const dir = val('mv-dir'), amt = toCents(val('mv-amt')), from = dir === 's' ? 'c' : 's';
    if (!(amt > 0)) fail('Enter an amount bigger than zero.');
    if (bal(balances(), S.me, from) < amt) fail(`Not enough in ${from === 'c' ? 'checking' : 'savings'}.`);
    await addTx(S.me + '.' + from, S.me + '.' + dir, amt, 'move', dir === 's' ? 'Moved to savings' : 'Moved to checking');
    clear('mv-amt'); toast('Money moved');
  },
  tellerReq: async kind => {
    const ids = {withdraw: 'tw-amt', deposit: 'td-amt', cd: 'tc-amt'}, amt = toCents(val(ids[kind]));
    if (!(amt > 0)) fail('Enter an amount bigger than zero.');
    if (kind !== 'deposit' && bal(balances(), S.me, 'c') < amt) fail('Not enough in checking.');
    await db.collection('teller').add({playerId: S.me, kind, amount: amt, acct: kind === 'deposit' ? val('td-acct') : 'c', status: 'waiting', day: today(), at: Date.now()});
    clear(ids[kind]); toast(kind === 'deposit' ? 'Bring your cash to the banker!' : 'Request sent. Go see the banker!');
  },
  extraPrincipal: async () => {
    const h = S.players[S.me]?.home, amt = toCents(val('xp-amt'));
    if (!h || h.mode !== 'mortgage') fail('You don’t have a mortgage.');
    if (!(amt > 0)) fail('Enter an amount.');
    if (amt > h.balance) fail(`You only owe ${money(h.balance)}.`);
    if (bal(balances(), S.me, 'c') < amt) fail('Not enough in checking.');
    await addTx(S.me + '.c', 'bank', amt, 'home', `Extra mortgage payment · ${h.name}`);
    const left = h.balance - amt;
    await db.doc('players/' + S.me).update({home: {...h, balance: left, mode: left <= 0 ? 'own' : 'mortgage'}});
    clear('xp-amt'); toast(left <= 0 ? 'Mortgage paid off. You own your home!' : `Now you owe ${money(left)}`);
  },
  openBiz: async t => {
    if (Object.values(S.shops).some(s => s.ownerId === S.me && bizType(s) === t)) fail(`You already have a ${BIZ[t].noun}.`);
    await db.collection('shops').add({type: t, name: val('ob-n-' + t).trim(), desc: val('ob-d-' + t).trim(), ownerId: S.me, at: Date.now()});
    clear('ob-n-' + t, 'ob-d-' + t); toast(`Your ${BIZ[t].noun} is open`);
  },
  startSale: async sid => {
    const pct = parseInt(val('sl-p-' + sid), 10), days = parseInt(val('sl-d-' + sid), 10);
    if (!(pct > 0 && pct < 100) || !(days >= 1)) fail('Pick a discount and how long.');
    await db.doc('shops/' + sid).update({sale: {pct, untilDay: today() + days - 1}});
    toast(`${pct}% off sale is live on Main Street`);
  },
  addItem: async sid => {
    const shop = S.shops[sid]; if (!shop || shop.ownerId !== S.me) fail('That business is closed.');
    const price = toCents(val('ai-p-' + sid)); if (!(price >= 0)) fail('Enter a price.');
    const st = val('ai-s-' + sid).trim();
    await db.collection('items').add({shopId: sid, name: val('ai-n-' + sid).trim(), price, stock: st === '' ? null : Math.max(0, parseInt(st, 10)), at: Date.now()});
    clear('ai-n-' + sid, 'ai-p-' + sid, 'ai-s-' + sid); toast('Added');
  },
  editItem: async id => {
    const price = toCents(val('ei-p-' + id)); if (!(price >= 0)) fail('Enter a price.');
    const st = val('ei-s-' + id).trim();
    await db.doc('items/' + id).update({price, stock: st === '' ? null : Math.max(0, parseInt(st, 10))});
    clear('ei-p-' + id, 'ei-s-' + id); toast('Saved');
  },
  request: async () => {
    const amt = toCents(val('lr-amt')), cr = credit(S.me);
    if (!(amt > 0)) fail('Enter how much you want to borrow.');
    if (amt > cr.avail) fail(`Your credit limit lets you borrow up to ${money(cr.avail)}.`);
    await db.collection('loans').add({playerId: S.me, amount: amt, purpose: val('lr-why').trim(), rate: cfg('loanRate'), balance: 0, interest: 0, payments: 0, missed: 0, status: 'requested', at: Date.now()});
    clear('lr-amt', 'lr-why'); toast('Sent to the banker');
  },
  repay: async id => {
    const l = S.loans[id], amt = toCents(val('rp-' + id));
    if (!l || l.status !== 'active') fail('That loan isn’t active.');
    if (!(amt > 0)) fail('Enter an amount to pay.');
    if (amt > l.balance) fail(`You only owe ${money(l.balance)}.`);
    if (bal(balances(), S.me, 'c') < amt) fail('Not enough in checking.');
    await addTx(S.me + '.c', 'bank', amt, 'repay', `Loan payment: ${l.purpose || 'loan'}`);
    const left = l.balance - amt;
    await db.doc('loans/' + id).update({balance: left, payments: (l.payments || 0) + 1, status: left <= 0 ? 'paid' : 'active'});
    clear('rp-' + id); toast(left <= 0 ? 'Loan paid off! Your credit score went up.' : 'Payment made');
  },
  approve: async id => {
    const l = S.loans[id], r = parseFloat(val('la-' + id)); if (!l) fail('That request is gone.');
    if (!(r >= 0)) fail('Enter an interest rate.');
    await addTx('bank', l.playerId + '.c', l.amount, 'loan', `Loan: ${l.purpose || 'loan'}`);
    await db.doc('loans/' + id).update({status: 'active', rate: r, balance: l.amount, approvedAt: Date.now()});
    toast(`Loan approved for ${nameOf(l.playerId)}`);
  },
  adjust: async () => {
    const who = val('ad-who'), acct = val('ad-acct'), give = val('ad-dir') === 'give', amt = toCents(val('ad-amt'));
    if (!S.players[who]) fail('Choose a resident.');
    if (!(amt > 0)) fail('Enter an amount.');
    const memo = val('ad-memo').trim() || (give ? 'Bonus from the bank' : 'Fine');
    await addTx(give ? 'bank' : who + '.' + acct, give ? who + '.' + acct : 'bank', amt, 'adjust', memo);
    clear('ad-amt', 'ad-memo'); toast(give ? 'Money given' : 'Money taken');
  },
  addPlayer: async () => {
    const pin = val('np-pin').trim(); if (pin && !/^\d{4}$/.test(pin)) fail('A PIN needs exactly 4 digits.');
    const wage = toCents(val('np-wage') || '0'), start = toCents(val('np-start') || '0');
    const ref = db.collection('players').doc();
    await ref.set({name: val('np-name').trim(), job: val('np-job').trim(), wage: wage > 0 ? wage : 0, pin, createdAt: Date.now()});
    if (start > 0) await addTx('bank', ref.id + '.c', start, 'adjust', 'Welcome to town');
    clear('np-name', 'np-job', 'np-wage', 'np-start', 'np-pin'); toast('Resident added');
  },
  editPlayer: async id => {
    const pin = val('ep-p-' + id).trim(); if (pin && !/^\d{4}$/.test(pin)) fail('A PIN needs exactly 4 digits.');
    const wage = toCents(val('ep-w-' + id) || '0');
    await db.doc('players/' + id).update({name: val('ep-n-' + id).trim(), job: val('ep-j-' + id).trim(), wage: wage > 0 ? wage : 0, pin});
    clear('ep-n-' + id, 'ep-j-' + id, 'ep-w-' + id, 'ep-p-' + id); toast('Saved');
  },
  settings: async () => {
    const pin = val('st-pin'); if (!/^\d{4}$/.test(pin)) fail('The banker PIN needs 4 digits.');
    const n = (k, min = 0) => { const v = parseFloat(val(k)); return isFinite(v) && v >= min ? v : min; };
    const ints = (k, min) => Math.max(min, Math.round(n(k, min)));
    const c = k => { const v = toCents(val(k) || '0'); return v > 0 ? v : 0; };
    const utilities = [0, 1, 2, 3].map(i => ({name: val('ut-n-' + i).trim(), amount: c('ut-a-' + i)})).filter(u => u.name && u.amount > 0);
    const homesList = [0, 1, 2, 3].map(i => ({name: val('hm-n-' + i).trim(), rent: c('hm-r-' + i), price: c('hm-p-' + i)})).filter(h => h.name && h.price > 0);
    await db.doc('town/settings').update({
      name: val('st-name').trim(), symbol: val('st-sym').trim() || '$', bankerPin: pin, day: ints('st-day', 1), eventChance: Math.min(100, n('st-ev')),
      payEvery: ints('st-payev', 1), billEvery: ints('st-billev', 1), rentEvery: ints('st-rentev', 1), billGrace: ints('st-grace', 0), interestEvery: ints('st-intev', 1),
      taxRate: n('st-tax'), savingsRate: n('st-sav'), loanRate: n('st-loan'), lateFee: c('st-late'), cdRate: n('st-cdr'), cdDays: ints('st-cdd', 1), cdPenalty: Math.min(100, n('st-cdp')),
      mortgageRate: n('st-mr'), mortgageTerm: ints('st-mt', 1), downPct: Math.min(100, n('st-dp')), utilities, homes: homesList,
    });
    const all = ['st-name','st-sym','st-pin','st-day','st-ev','st-payev','st-billev','st-rentev','st-grace','st-intev','st-tax','st-sav','st-loan','st-late','st-cdr','st-cdd','st-cdp','st-mr','st-mt','st-dp'];
    for (let i = 0; i < 4; i++) all.push('ut-n-' + i, 'ut-a-' + i, 'hm-n-' + i, 'hm-r-' + i, 'hm-p-' + i);
    clear(...all); toast('Settings saved');
  },
};

app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  e.preventDefault();
  const fn = acts[el.dataset.act]; if (fn) fn(el.dataset.id);
});
app.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const fn = forms[f.dataset.form]; if (fn) run(() => fn(f.dataset.id));
});

// ---------- boot ----------
(async () => {
  const timer = setTimeout(() => { S.slow = true; render(); }, 10000);
  try {
    if (window.firebase && FIREBASE_CONFIG && FIREBASE_CONFIG.projectId) { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.firestore(); }
  } catch (e) { console.error(e); db = null; }
  if (!db) { clearTimeout(timer); S.dbState = 'none'; render(); return; }
  S.dbState = 'ok';
  const remembered = ls('ptb.me'); if (remembered) S.me = remembered;
  const onErr = e => { S.err = e.code; clearTimeout(timer); schedule(); };
  db.doc('town/settings').onSnapshot(s => {
    S.settings = s.exists ? s.data() : null;
    if (!s.metadata.fromCache) { S.settingsConfirmed = true; clearTimeout(timer); S.slow = false; }
    schedule();
  }, onErr);
  const map = (name, key) => db.collection(name).onSnapshot(q => { const o = {}; q.docs.forEach(d => o[d.id] = {id: d.id, ...d.data()}); S[key] = o; schedule(); }, onErr);
  const list = (name, key) => db.collection(name).onSnapshot(q => { S[key] = q.docs.map(d => ({id: d.id, ...d.data()})).sort((a, b) => (b.at || 0) - (a.at || 0)); schedule(); }, onErr);
  map('players', 'players'); list('tx', 'tx'); map('shops', 'shops'); map('items', 'items'); list('orders', 'orders'); map('loans', 'loans');
  list('bills', 'bills'); list('holdings', 'holdings'); list('teller', 'teller'); list('cds', 'cds');
  const bootAt = Date.now() - 5000;
  db.collection('messages').onSnapshot(q => {
    const fresh = q.docChanges().filter(c => c.type === 'added').map(c => c.doc.data())
      .filter(m => m.at > bootAt && S.me && m.from !== S.me && (m.to === S.me || m.to === 'board'));
    S.messages = q.docs.map(d => ({id: d.id, ...d.data()}));
    const m = fresh[fresh.length - 1];
    if (m) { const key = m.to === 'board' ? 'board' : m.from; if (!(S.tab === 'messages' && S.thread === key)) toast(m.to === 'board' ? `New post on the bulletin board from ${contactName(m.from)}` : `New message from ${contactName(m.from)}`); }
    schedule();
  }, onErr);
  render();
})();
})();
</script>
</body></html>
