      ${S.pin.wrong ? '<p class="neg" style="text-align:center">That’s not it. Try again.</p>' : ''}
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-act="digit" data-id="${n}">${n}</button>`).join('')}<button data-act="pinCancel" style="font-size:1rem">Cancel</button><button data-act="digit" data-id="0">0</button><button data-act="digitBack" style="font-size:1rem">Delete</button></div></div></div>`;
  }
  if (S.modal) return `<div class="overlay"><div class="dialog"><h3>${esc(S.modal.title)}</h3><p class="muted">${esc(S.modal.body)}</p>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="modalNo">Cancel</button><button class="btn ${S.modal.danger ? 'danger' : 'gold'}" data-act="modalYes">${esc(S.modal.ok)}</button></div></div></div>`;
  return '';
}
const confirmIt = (title, body, ok, fn, danger) => { S.modal = {title, body, ok, fn, danger}; render(); };

// ---------- actions ----------
function enter(target) {
  S.pin = null; S.me = target; S.tab = null; S.thread = null;
  if (target !== 'bank') ls('ptb.me', target); else ls('ptb.me', null);
  window.scrollTo(0, 0); render();
}
const acts = {
  pick: id => { const p = S.players[id]; if (p?.pin) { S.pin = {target: id, digits: ''}; render(); } else enter(id); },
  pickBank: () => { if (S.settings.bankerPin) { S.pin = {target: 'bank', digits: ''}; render(); } else enter('bank'); },
  digit: d => {
    const P = S.pin; if (!P || P.digits.length >= 4) return;
    P.digits += d; P.wrong = false;
    if (P.digits.length === 4) {
      const want = P.target === 'bank' ? S.settings.bankerPin : S.players[P.target]?.pin;
      if (P.digits === String(want)) return enter(P.target);
      P.digits = ''; P.wrong = true;
    }
    render();
  },
  digitBack: () => { if (S.pin) { S.pin.digits = S.pin.digits.slice(0, -1); render(); } },
  pinCancel: () => { S.pin = null; render(); },
  switch: () => { S.me = null; S.thread = null; ls('ptb.me', null); render(); },
  openThread: id => { S.thread = id; markRead(id); render(); setTimeout(() => document.getElementById('msg-text')?.focus(), 50); },
  closeThread: () => { S.thread = null; render(); },
  claimGig: id => run(async () => {
    if (activeGigs(S.me).length >= 2) fail('Finish one of your jobs first.');
    const g = S.gigs.find(x => x.id === id), ref = db.doc('gigs/' + id);
    if (g?.postedBy === S.me) fail('That’s your own request.');
    const [q, raw] = g && g.kind === 'random' ? makeProblem(levelFor(S.me, g.pay)) : [null, null], a = raw == null ? null : Math.round(raw * 100) / 100;
    // Save the claim directly (no server read), so jobs still work when the daily read allowance runs low.
    if (!g || g.status !== 'open') fail('Someone else took that job.');
    if ((g.failedBy || []).includes(S.me)) fail('You already failed this job. Try a different one.');
    await ref.update({status: 'claimed', claimedBy: S.me, q, a, tries: 0, note: null, claimedDay: today()});
    setTimeout(() => { const now = S.gigs.find(x => x.id === id); if (now && now.claimedBy && now.claimedBy !== S.me) toast('Someone else took that job a split second before you.', true); }, 2500);
    toast('Job taken. Get to work!');
  }),
  quitGig: id => {
    const g = S.gigs.find(x => x.id === id); if (!g) return;
    if (g.kind === 'random' && g.tries > 0) return confirmIt('Quit this job?', 'You already answered wrong, so quitting counts as failing the job. You won’t get paid and can’t take it again.', 'Quit and fail', async () => {
      await db.doc('gigs/' + id).update({status: 'open', claimedBy: null, q: null, a: null, tries: 0, failedBy: [...(g.failedBy || []), S.me]}); toast('Job failed');
    }, true);
    run(async () => { await db.doc('gigs/' + id).update({status: 'open', claimedBy: null, q: null, a: null, tries: 0}); toast('You put that job back on the board'); });
  },
  finishGig: id => run(async () => { const g = S.gigs.find(x => x.id === id); await db.doc('gigs/' + id).update({status: 'review'}); if (g?.kind === 'request') await sendMsg(S.me, g.postedBy, `I finished “${g.title}.” Check it on the Odd jobs tab and pay me if it looks good!`); toast(`Sent to ${g ? reviewerOf(g) : 'the banker'} to check`); }),
  approveGig: id => run(async () => {
    const g = S.gigs.find(x => x.id === id); if (!g || g.status !== 'review') fail('That job was already handled.');
    await addTx('bank', g.claimedBy + '.c', g.pay, 'job', `Odd job: ${g.title}`);
    await db.doc('gigs/' + id).update({status: 'paid', paidDay: today(), paidAt: Date.now()});

  payBill: id => run(async () => {
    const x = S.bills.find(y => y.id === id); if (!x || (x.status !== 'due' && x.status !== 'late')) fail('That bill is already paid.');
    if (bal(balances(), S.me, 'c') < x.total) fail(`Not enough in checking. You need ${money(x.total)}.`);
    const provider = x.payToShopId ? S.shops[x.payToShopId] : Object.values(S.shops).find(sh => sh.ownerId === x.payTo && sh.name === x.payToShop);
    const payProvider = x.payTo && S.players[x.payTo] && (!provider || isOpenBiz(provider));
    await addTx(S.me + '.c', payProvider ? x.payTo + '.c' : 'bank', x.total, x.kind === 'rent' || x.kind === 'mortgage' ? 'rent' : 'bill', `${x.label || 'Utilities'} bill from Day ${x.issuedDay}` + (x.status === 'late' ? ' (late)' : ''));
    await db.doc('bills/' + id).update({status: x.status === 'late' ? 'paidLate' : 'paid', paidDay: today(), paidAt: Date.now()});
    let extra = '';
    const h = S.players[S.me]?.home;
    if (x.kind === 'mortgage' && h && h.mode === 'mortgage') {
      const interest = Math.round(h.balance * h.rate / 100), principal = Math.max(0, (x.base || 0) - interest), left = Math.max(0, h.balance - principal);
      await db.doc('players/' + S.me).update({home: {...h, balance: left, mode: left <= 0 ? 'own' : 'mortgage'}});
      extra = left <= 0 ? ' You own your home now!' : ` ${money(principal)} went toward your home.`;
    }
    toast((x.status === 'late' ? 'Bill paid. Try to pay on time next time.' : 'Bill paid on time. Your credit score went up.') + extra);
  }),
  buy: id => run(async () => {
    const it = S.items[id]; if (!it) fail('That item is gone.');
    const shop = S.shops[it.shopId]; if (!shop) fail('That business closed.');
    if (!isOpenBiz(shop)) fail(`${shop.name} is closed right now.`);
    const isR = BIZ[bizType(shop)].tips, pct = salePct(shop), unit = priceNow(it, shop);
    const qty = parseInt(val('q-' + id), 10); if (!(qty >= 1)) fail('Choose how many.');
    const isHotel = bizType(shop) === 'hotel', stay = isHotel ? hotelDay(shop.id) : null;
    if (isHotel) { const f = roomsFree(shop, it, stay); if (f < qty) fail(f ? `Only ${f} room${f > 1 ? 's' : ''} free that night.` : 'No rooms free that night. Try another night.'); }
    else if (it.stock != null && it.stock < qty) fail(`Only ${it.stock} left.`);
    const sub = unit * qty, tipPct = isR ? (parseFloat(val('tip-' + shop.id)) || 0) : 0, tip = Math.round(sub * tipPct / 100), total = sub + tip;
    if (bal(balances(), S.me, 'c') < total) fail(`Not enough in checking. You need ${money(total)}.`);
    await addTx(S.me + '.c', acctOf(shop.ownerId), total, bizType(shop) === 'restaurant' ? 'meal' : 'purchase', `${qty} × ${it.name} at ${shop.name}` + (isHotel ? ` for the night of Day ${stay}` : '') + (pct ? ` (${pct}% off)` : '') + (tip ? ` + ${money(tip)} tip` : ''));
    if (!isHotel && it.stock != null) await db.doc('items/' + id).update({stock: it.stock - qty});
    if (hasCogs(shop)) {
      const farm = bizType(shop) === 'restaurant' ? pickRandom(Object.values(S.shops).filter(f => bizType(f) === 'farm' && f.ownerId !== shop.ownerId && isOpenBiz(f))) : null;
      const cogs = qty * (farm ? Math.round(unitCost(it) * (100 - cfg('farmDiscount')) / 100) : unitCost(it));
      if (cogs > 0 && farm) await addTx(acctOf(shop.ownerId), acctOf(farm.ownerId), cogs, 'supply', `Ingredients for ${qty} × ${it.name} from ${farm.name}`, {shopId: shop.id, supplierShopId: farm.id});
      else if (cogs > 0) await addTx(acctOf(shop.ownerId), 'bank', cogs, 'supply', `Cost of goods: ${qty} × ${it.name}`, {shopId: shop.id});
    }
    await db.collection('orders').add({shopId: shop.id, bizType: bizType(shop), stayDay: stay, itemId: id, itemName: it.name, qty, price: unit, salePct: pct, tip, total, buyerId: S.me, sellerId: shop.ownerId, status: 'new', day: today(), at: Date.now()});
    let stampMsg = '';
    if (shop.ownerId !== 'bank' && total >= 100) {
      const st = stampsOf(S.me) + (S.orders.some(o => o.buyerId === S.me && o.at > Date.now() - 2000) ? 0 : 1), redeemed = Number(S.players[S.me]?.stampsRedeemed || 0);
      if (Math.floor(st / STAMPS_PER) > redeemed && cfg('stampReward') > 0) { await addTx('bank', S.me + '.c', cfg('stampReward'), 'stamps', 'Shop-local stamp card filled!'); await db.doc('players/' + S.me).update({stampsRedeemed: redeemed + 1}); stampMsg = ` Stamp card full: +${money(cfg('stampReward'))}!`; }
      else stampMsg = ` Stamp ${st % STAMPS_PER || STAMPS_PER} of ${STAMPS_PER}.`;
    }
    clear('q-' + id); toast((isHotel ? `Booked ${qty} × ${it.name} for ${stay === today() ? 'tonight' : 'Day ' + stay}` : `Ordered ${qty} × ${it.name}` + (pct ? ` and saved ${money((it.price - unit) * qty)}` : '')) + stampMsg);
  }),

      for (const b of openBills(owner).sort((a, c) => a.dueDay - c.dueDay)) { if (left < b.total) continue; left -= b.total; await db.doc('bills/' + b.id).update({status: b.status === 'late' ? 'paidLate' : 'paid', paidDay: today(), paidAt: Date.now(), paidBy: 'foreclosure'}); }

      await db.doc('town/settings').update({news: [{day: today(), title: `Bank forecloses on ${sh.name}`, text: `The town bank took over ${sh.name} from ${nameOf(owner)} after unpaid debts piled up. It will be run by the bank until it’s sold.`}, ...(S.settings.news || [])].slice(0, 12)});

  cdEarly: id => run(async () => {

  }),
  cancelTeller: id => run(async () => { await db.doc('teller/' + id).update({status: 'declined'}); toast('Request canceled'); }),
  tellerDecline: id => run(async () => { await db.doc('teller/' + id).update({status: 'declined'}); toast('Declined'); }),
  tellerDone: id => run(async () => {
    const r = S.teller.find(x => x.id === id); if (!r || r.status !== 'waiting') fail('That request is already handled.');
    const pid = r.playerId, c = bal(balances(), pid, 'c'), who = nameOf(pid);
    if (r.kind === 'withdraw') { if (c < r.amount) fail(`${who} only has ${money(c)} in checking.`); await addTx(pid + '.c', 'bank', r.amount, 'cash', 'Cash withdrawal at the teller window'); }
    if (r.kind === 'deposit') await addTx('bank', pid + '.' + (r.acct === 's' ? 's' : 'c'), r.amount, 'cash', 'Cash deposit at the teller window');
    if (r.kind === 'cd') {
      if (c < r.amount) fail(`${who} only has ${money(c)} in checking.`);
      const payout = Math.round(r.amount * (100 + cfg('cdRate')) / 100);
      await addTx(pid + '.c', 'bank', r.amount, 'cd', `Opened a CD: ${money(r.amount)} for ${every('cdDays')} days`);
      await db.collection('cds').add({playerId: pid, amount: r.amount, rate: cfg('cdRate'), payout, openDay: today(), matureDay: today() + every('cdDays'), status: 'open', at: Date.now()});
    }
    if (r.kind === 'cdclose') {
      const cd = S.cds.find(x => x.id === r.cdId); if (!cd || cd.status !== 'open') fail('That CD is already closed.');
      const back = Math.round(cd.amount * (100 - cfg('cdPenalty')) / 100);
      await addTx('bank', pid + '.c', back, 'cd', `Cashed out a CD early (${cfg('cdPenalty')}% penalty)`);
      await db.doc('cds/' + cd.id).update({status: 'closed'});
    }
    if (r.kind === 'mortgage') {
      const x = homes()[r.homeIdx]; if (!x) fail('That home no longer exists in Settings.');
      if (S.players[pid]?.home) fail(`${who} already has a home.`);
      const down = Math.round(x.price * cfg('downPct') / 100), P = x.price - down;
      if (c < down) fail(`${who} needs ${money(down)} in checking for the down payment.`);
      await addTx(pid + '.c', 'bank', down, 'home', `Down payment on the ${x.name}`);
      await db.doc('players/' + pid).update({home: {name: x.name, mode: P > 0 ? 'mortgage' : 'own', rent: x.rent, price: x.price, balance: P, rate: cfg('mortgageRate'), payment: mortgagePayment(P, cfg('mortgageRate'), every('mortgageTerm'))}, homelessSince: null});
    }
    await db.doc('teller/' + id).update({status: 'done', doneDay: today()});
    toast({withdraw: `Handed ${who} ${money(r.amount)} in cash`, deposit: `Deposited ${money(r.amount)} for ${who}`, cd: `CD opened for ${who}`, cdclose: `CD cashed out for ${who}`, mortgage: `Mortgage approved. ${who} has a new home!`}[r.kind]);
  }),
  decline: id => run(async () => { await db.doc('loans/' + id).update({status: 'declined'}); toast('Loan declined'); }),
  missed: id => confirmIt('Record a missed payment?', `This lowers ${nameOf(S.loans[id]?.playerId)}'s credit score by 60 points.`, 'Record it', async () => {

};

    if (bizCount(S.me) >= bizLimit()) fail(`You can run up to ${bizLimit()} businesses. Close one first.`);
    if (Object.values(S.shops).some(s => s.ownerId === S.me && bizType(s) === t)) fail(`You already have a ${BIZ[t].noun}.`);
    const cost = bizCost(t), name = val('ob-n').trim(); if (!name) fail('Give your business a name.');
    if (bal(balances(), S.me, 'c') < cost) fail(`Opening a ${BIZ[t].noun} costs ${money(cost)}. You need more in checking, or ask the bank for a loan.`);
    if (cost > 0) await addTx(S.me + '.c', 'bank', cost, 'biz', `License and setup for ${name}`);
    await db.collection('shops').add({type: t, name, desc: val('ob-d').trim(), ownerId: S.me, startCost: cost, license: {status: 'active', expiresDay: today() + bizRule(t, 'license')}, inspection: {nextDue: today() + bizRule(t, 'inspect')}, at: Date.now()});
    clear('ob-n', 'ob-d'); toast(`${name} is open for business!`);
  },
  startSale: async sid => {
    const pct = parseInt(val('sl-p-' + sid), 10), days = parseInt(val('sl-d-' + sid), 10);
    if (!(pct > 0 && pct < 100) || !(days >= 1)) fail('Pick a discount and how long.');
    await db.doc('shops/' + sid).update({sale: {pct, untilDay: today() + days - 1}});
    await announce(S.me, 'sale', `SALE at ${S.shops[sid]?.name}: ${pct}% off everything ${days === 1 ? 'today only' : 'through Day ' + (today() + days - 1)}!`, {shopId: sid});
    toast(`${pct}% off sale is live on Main Street`);
  },
  addItem: async sid => {
    const shop = S.shops[sid]; if (!shop || shop.ownerId !== S.me) fail('That business is closed.');
    const price = toCents(val('ai-p-' + sid)); if (!(price >= 0)) fail('Enter a price.');
    const st = val('ai-s-' + sid).trim();
    if (bizType(shop) === 'hotel' && !(parseInt(st, 10) > 0)) fail('Set how many rooms of this type.');
    if (needsStock(shop)) {
      const qty = Math.max(0, parseInt(st, 10) || 0), cost = qty * unitCost({price});
      if (shop.ownerId !== 'bank' && cost > 0 && bal(balances(), S.me, 'c') < cost) fail(`${qty} to start would cost ${money(cost)}. Not enough in checking. Try fewer.`);
      if (cost > 0) await addTx(acctOf(shop.ownerId), 'bank', cost, 'supply', `Stocked ${qty} × ${val('ai-n-' + sid).trim()} for ${shop.name}`, {shopId: sid});
    }
    await announce(S.me, 'price', `New at ${shop.name}: ${val('ai-n-' + sid).trim()} for ${money(price)}${bizType(shop) === 'hotel' ? ' a night' : ''}.`, {shopId: sid, isNew: true});
    await db.collection('items').add({shopId: sid, name: val('ai-n-' + sid).trim(), price, stock: st === '' ? null : Math.max(0, parseInt(st, 10)), at: Date.now()});
    clear('ai-n-' + sid, 'ai-p-' + sid, 'ai-s-' + sid); toast('Added');
  },
  restock: async id => {
    const it = S.items[id], shop = it && S.shops[it.shopId]; if (!it || !shop) fail('That item is gone.');
    const qty = parseInt(val('rs-' + id), 10); if (!(qty >= 1)) fail('Choose how many to buy.');
    const src = val('rs-src-' + id), farm = src && src !== 'w' ? S.shops[src] : null;
    if (farm && (!isOpenBiz(farm) || bizType(farm) !== 'farm')) fail('That farm stand is closed right now. Pick another supplier.');
    const each = farm ? Math.round(unitCost(it) * (100 - cfg('farmDiscount')) / 100) : unitCost(it), cost = qty * each;
    if (shop.ownerId !== 'bank' && bal(balances(), shop.ownerId, 'c') < cost) fail(`${qty} × ${it.name} costs ${money(cost)}. Not enough in checking.`);
    if (farm) {
      await addTx(acctOf(shop.ownerId), acctOf(farm.ownerId), cost, 'supply', `${shop.name} bought ingredients for ${qty} × ${it.name} from ${farm.name}`, {shopId: shop.id, supplierShopId: farm.id});
      if (farm.ownerId !== 'bank') await sendMsg('bank', farm.ownerId, `${shop.name} bought ingredients from ${farm.name}: ${money(cost)} is in your checking.`);
    } else await addTx(acctOf(shop.ownerId), 'bank', cost, 'supply', `Restocked ${qty} × ${it.name} for ${shop.name}`, {shopId: shop.id});
    await db.doc('items/' + id).update({stock: (it.stock || 0) + qty});
    clear('rs-' + id); toast(`Restocked ${qty} × ${it.name} for ${money(cost)}${farm ? ' from ' + farm.name : ''}`);
  },
  editItem: async id => {
    const price = toCents(val('ei-p-' + id)); if (!(price >= 0)) fail('Enter a price.');
    const st = val('ei-s-' + id).trim(), it = S.items[id], shop = it && S.shops[it.shopId];
    await db.doc('items/' + id).update(shop && needsStock(shop) ? {price} : {price, stock: st === '' ? null : Math.max(0, parseInt(st, 10))});
    if (it && shop && price !== it.price) await announce(S.me, 'price', `Price change at ${shop.name}: ${it.name} ${price > it.price ? 'goes up' : 'drops'} from ${money(it.price)} to ${money(price)}${bizType(shop) === 'hotel' ? ' a night' : ''}.`, {shopId: shop.id, up: price > it.price});
    clear('ei-p-' + id, 'ei-s-' + id); toast('Saved');
  },
  request: async () => {
    const amt = toCents(val('lr-amt')), cr = credit(S.me);
    if (!(amt > 0)) fail('Enter how much you want to borrow.');
    if (amt > cr.avail) fail(`Your credit limit lets you borrow up to ${money(cr.avail)}.`);
    await db.collection('loans').add({playerId: S.me, amount: amt, purpose: val('lr-why').trim(), rate: cfg('loanRate'), balance: 0, interest: 0, payments: 0, missed: 0, status: 'requested', at: Date.now()});
    clear('lr-amt', 'lr-why'); toast('Sent to the banker');
  },
  repay: async id => {
    const l = S.loans[id], amt = toCents(val('rp-' + id));
    if (!l || l.status !== 'active') fail('That loan isn’t active.');
    if (!(amt > 0)) fail('Enter an amount to pay.');
    if (amt > l.balance) fail(`You only owe ${money(l.balance)}.`);
    if (bal(balances(), S.me, 'c') < amt) fail('Not enough in checking.');
    await addTx(S.me + '.c', 'bank', amt, 'repay', `Loan payment: ${l.purpose || 'loan'}`);
    const left = l.balance - amt;
    await db.doc('loans/' + id).update({balance: left, payments: (l.payments || 0) + 1, status: left <= 0 ? 'paid' : 'active'});
    clear('rp-' + id); toast(left <= 0 ? 'Loan paid off! Your credit score went up.' : 'Payment made');
  },
  approve: async id => {
    const l = S.loans[id], r = parseFloat(val('la-' + id)); if (!l) fail('That request is gone.');
    if (!(r >= 0)) fail('Enter an interest rate.');
    await addTx('bank', l.playerId + '.c', l.amount, 'loan', `Loan: ${l.purpose || 'loan'}`);
    await db.doc('loans/' + id).update({status: 'active', rate: r, balance: l.amount, approvedAt: Date.now()});
    toast(`Loan approved for ${nameOf(l.playerId)}`);
  },
  adjust: async () => {
    const who = val('ad-who'), acct = val('ad-acct'), give = val('ad-dir') === 'give', amt = toCents(val('ad-amt'));
    if (!S.players[who]) fail('Choose a resident.');
    if (!(amt > 0)) fail('Enter an amount.');
    const memo = val('ad-memo').trim() || (give ? 'Bonus from the bank' : 'Fine');
    await addTx(give ? 'bank' : who + '.' + acct, give ? who + '.' + acct : 'bank', amt, 'adjust', memo);
    clear('ad-amt', 'ad-memo'); toast(give ? 'Money given' : 'Money taken');
  },
  addPlayer: async () => {
    const pin = val('np-pin').trim(); if (pin && !/^\d{4}$/.test(pin)) fail('A PIN needs exactly 4 digits.');
    const wage = toCents(val('np-wage') || '0'), start = toCents(val('np-start') || '0');
    const ref = db.collection('players').doc();
    await ref.set({name: val('np-name').trim(), job: val('np-job').trim(), wage: wage > 0 ? wage : 0, pin, grade: parseInt(val('np-grade'), 10) || 5, tries: parseInt(val('np-tries'), 10) || 3, homelessSince: today(), createdAt: Date.now()});
    if (start > 0) await addTx('bank', ref.id + '.c', start, 'adjust', 'Welcome to town');
    clear('np-name', 'np-job', 'np-wage', 'np-start', 'np-pin', 'np-grade', 'np-tries'); toast('Resident added');
  },
  editPlayer: async id => {
    const pin = val('ep-p-' + id).trim(); if (pin && !/^\d{4}$/.test(pin)) fail('A PIN needs exactly 4 digits.');
    const wage = toCents(val('ep-w-' + id) || '0');
    await db.doc('players/' + id).update({name: val('ep-n-' + id).trim(), job: val('ep-j-' + id).trim(), wage: wage > 0 ? wage : 0, pin, grade: parseInt(val('ep-g-' + id), 10) || 5, tries: parseInt(val('ep-t-' + id), 10) || 3});
    clear('ep-n-' + id, 'ep-j-' + id, 'ep-w-' + id, 'ep-p-' + id, 'ep-g-' + id, 'ep-t-' + id); toast('Saved');
  },
  settings: async () => {
    const pin = val('st-pin'); if (!/^\d{4}$/.test(pin)) fail('The banker PIN needs 4 digits.');
    const n = (k, min = 0) => { const v = parseFloat(val(k)); return isFinite(v) && v >= min ? v : min; };
    const ints = (k, min) => Math.max(min, Math.round(n(k, min)));
    const c = k => { const v = toCents(val(k) || '0'); return v > 0 ? v : 0; };
    const utilities = [0, 1, 2, 3].map(i => ({name: val('ut-n-' + i).trim(), amount: c('ut-a-' + i)})).filter(u => u.name && u.amount > 0);
    const homesList = [0, 1, 2, 3].map(i => ({name: val('hm-n-' + i).trim(), rent: c('hm-r-' + i), price: c('hm-p-' + i)})).filter(h => h.name && h.price > 0);
    await db.doc('town/settings').update({
      name: val('st-name').trim(), symbol: val('st-sym').trim() || '$', bankerPin: pin, day: ints('st-day', 1), eventChance: Math.min(100, n('st-ev')), surpriseChance: Math.min(100, n('st-surp')), auditChance: Math.min(100, n('st-aud')), auditFine: c('st-audf'), auditDays: ints('st-audd', 0), auditPass: Math.min(5, ints('st-audp', 1)),
      payEvery: ints('st-payev', 1), billEvery: ints('st-billev', 1), rentEvery: ints('st-rentev', 1), billGrace: ints('st-grace', 0), interestEvery: ints('st-intev', 1),
      taxRate: n('st-tax'), savingsRate: n('st-sav'), loanRate: n('st-loan'), lateFee: c('st-late'), cdRate: n('st-cdr'), cdDays: ints('st-cdd', 1), cdPenalty: Math.min(100, n('st-cdp')),
      mortgageRate: n('st-mr'), mortgageTerm: ints('st-mt', 1), downPct: Math.min(100, n('st-dp')), utilities, homes: homesList,
      pick3Price: c('st-lp'), lotteryEvery: ints('st-le', 1), pick3Max: Math.min(40, ints('st-lm', 4)), pick3Share: Math.min(100, n('st-ls')), pick3Seed: c('st-lseed'), pick3Boost: c('st-lboost'), pick3Match2: c('st-lm2'), pick3Match1: c('st-lm1'), scratchPrice: c('st-scr'), scratchLimit: ints('st-scrl', 0), gigsPerDay: Math.min(16, ints('st-gigs', 0)), bizCosts: Object.fromEntries(Object.keys(BIZ).map(t => [t, c('bc-' + t)])), bizRules: Object.fromEntries(Object.keys(BIZ).map(t => [t, {inspect: ints('br-i-' + t, 1), license: ints('br-l-' + t, 1)}])), renewPct: Math.min(200, n('st-renew')), bizLimit: Math.min(8, ints('st-bizlim', 1)), wholesalePct: Math.min(100, n('st-whole')), stockSwing: Math.min(50, n('st-swing')), marketChance: Math.min(100, n('st-mkt')), profitShare: Math.min(100, n('st-psh')), needsCount: Math.min(4, ints('st-ndn', 0)), needsBonus: c('st-ndb'), needsPenalty: c('st-ndp'), stampReward: c('st-stmp'), farmDiscount: Math.min(90, n('st-farm')), dividendEvery: ints('st-pse', 1),
    });
    const all = ['st-name','st-sym','st-pin','st-day','st-ev','st-surp','st-aud','st-audf','st-audd','st-audp','st-payev','st-billev','st-rentev','st-grace','st-intev','st-tax','st-sav','st-loan','st-late','st-cdr','st-cdd','st-cdp','st-mr','st-mt','st-dp','st-lp','st-le','st-lm','st-ls','st-lseed','st-lboost','st-lm2','st-lm1','st-scr','st-scrl','st-gigs','st-swing','st-mkt','st-psh','st-pse','st-ndn','st-ndb','st-ndp','st-stmp','st-farm'];
    Object.keys(BIZ).forEach(t => all.push('bc-' + t, 'br-i-' + t, 'br-l-' + t)); all.push('st-renew', 'st-bizlim', 'st-whole');
    for (let i = 0; i < 4; i++) all.push('ut-n-' + i, 'ut-a-' + i, 'hm-n-' + i, 'hm-r-' + i, 'hm-p-' + i);
    clear(...all); toast('Settings saved');
  },
};

app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  e.preventDefault();
  const fn = acts[el.dataset.act]; if (fn) fn(el.dataset.id);
});
app.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const fn = forms[f.dataset.form]; if (fn) run(() => fn(f.dataset.id));
});

// ---------- boot ----------
(async () => {
  const timer = setTimeout(() => { S.slow = true; render(); }, 10000);
  try {
    if (window.firebase && FIREBASE_CONFIG && FIREBASE_CONFIG.projectId) { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.firestore();
      // Keep a copy of the town on this device so reopening the app doesn't re-download everything.
      try { await db.enablePersistence({synchronizeTabs: true}); } catch (e) { console.warn('Offline cache unavailable', e && e.code); } }
  } catch (e) { console.error(e); db = null; }
  if (!db) { clearTimeout(timer); S.dbState = 'none'; render(); return; }
  S.dbState = 'ok';
  const remembered = ls('ptb.me'); if (remembered) S.me = remembered;
  const onErr = e => { S.err = e.code; clearTimeout(timer); schedule(); };
  db.doc('town/settings').onSnapshot(s => {
    S.settings = s.exists ? s.data() : null;
    if (!s.metadata.fromCache) { S.settingsConfirmed = true; clearTimeout(timer); S.slow = false; }
    schedule();
  }, onErr);
  const map = (name, key) => db.collection(name).onSnapshot(q => { const o = {}; q.docs.forEach(d => o[d.id] = {id: d.id, ...d.data()}); S[key] = o; schedule(); }, onErr);
  const list = (name, key) => db.collection(name).onSnapshot(q => { S[key] = q.docs.map(d => ({id: d.id, ...d.data()})).sort((a, b) => (b.at || 0) - (a.at || 0)); schedule(); }, onErr);
  const bootAt = Date.now() - 5000;
  map('players', 'players'); list('tx', 'tx'); map('shops', 'shops'); map('items', 'items');  map('loans', 'loans');
  list('bills', 'bills'); list('holdings', 'holdings'); list('teller', 'teller'); list('cds', 'cds'); list('lottery', 'lottoTickets'); list('gigs', 'gigs');
  db.collection('orders').onSnapshot(q => {
    S.orders = q.docs.map(d => ({id: d.id, ...d.data()})).sort((a, b) => (b.at || 0) - (a.at || 0));
    if (S.me && S.me !== 'bank') {
      for (const c of q.docChanges()) {
        const o = c.doc.data(); if ((o.at || 0) < bootAt) continue;
        const shop = S.shops[o.shopId]?.name || 'your business', T = bizOf(o.bizType);
        if (c.type === 'added' && o.sellerId === S.me && o.buyerId !== S.me) toast(`New order: ${o.qty} × ${o.itemName} from ${nameOf(o.buyerId)} at ${shop}${o.tip ? ' (+' + money(o.tip) + ' tip)' : ''}${S.items[o.itemId]?.stock === 0 ? `. ${o.itemName} is now SOLD OUT. Restock it!` : ''}`);
        if (c.type === 'modified' && o.buyerId === S.me && o.status === 'done') toast(`${shop}: your ${o.itemName} ${o.qty > 1 ? 'are' : 'is'} ${T.done.toLowerCase()}!`);
        if (c.type === 'modified' && o.buyerId === S.me && o.status === 'refunded') toast(`${shop} refunded your ${o.itemName}`);
      }
    }
    schedule();
  }, onErr);
  db.collection('messages').onSnapshot(q => {
    const fresh = q.docChanges().filter(c => c.type === 'added').map(c => c.doc.data())
      .filter(m => m.at > bootAt && S.me && m.from !== S.me && (m.to === S.me || m.to === 'board'));
    S.messages = q.docs.map(d => ({id: d.id, ...d.data()}));
    const m = fresh[fresh.length - 1];
    if (m) { const key = m.to === 'board' ? 'board' : m.from; if (!(S.tab === 'messages' && S.thread === key)) toast(m.to === 'board' ? `New post on the bulletin board from ${contactName(m.from)}` : `New message from ${contactName(m.from)}`); }
    schedule();
  }, onErr);
  // Auto days: only the device that started the clock advances the day.
  setInterval(() => {
    if (!S.settings?.autoOn) return;
    schedule();
    if (ls('ptb.autoHost') === '1' && S.settings.autoNextAt && Date.now() >= S.settings.autoNextAt && !S.busy && !S.modal) run(advanceDay);
  }, 15000);
  render();
})();
})();
</script>
</body></html>
