<title>Pretend Town Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@500&family=Caveat:wght@600&display=swap">
<style>
/* Layout: a town bank on an iPad. Sticky header + tab rail, then a two-column working area that stacks on phones. Account cards borrow banknote engraving. */
:root{
  --paper:#EDF2EE; --card:#FAFCFA; --ink:#12302A; --muted:#566B63; --line:#C9D7CF;
  --note:#1B6A50; --note-ink:#FFFFFF; --coin:#D4951A; --good:#1C7A4C; --bad:#B4412C; --warn:#A87414;
  --shade:rgba(18,48,42,.08);
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-num:"DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --f-sig:"Caveat", "Bradley Hand", cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1613; --card:#14211D; --ink:#E2EDE8; --muted:#94A9A0; --line:#2A3D36;
  --note:#47AE86; --note-ink:#06140F; --coin:#E6AE48; --good:#5CC48E; --bad:#E7735C; --warn:#DDAA4E;
  --shade:rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0D1613; --card:#14211D; --ink:#E2EDE8; --muted:#94A9A0; --line:#2A3D36;
  --note:#47AE86; --note-ink:#06140F; --coin:#E6AE48; --good:#5CC48E; --bad:#E7735C; --warn:#DDAA4E;
  --shade:rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.pos{color:var(--good)} .neg{color:var(--bad)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1160px;margin:0 auto}
.seal{width:38px;height:38px;border-radius:50%;background:var(--note);color:var(--note-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.1rem;flex:none;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--note)}
.brand{min-width:0;flex:1}
.brand b{display:block;font-family:var(--f-display);font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:.8rem;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1160px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
/* Desktops and wide screens: wrap tabs onto more rows instead of scrolling sideways (no swipe with a mouse). */
@media (min-width:720px), (hover:hover) and (pointer:fine){.tabs{flex-wrap:wrap;overflow-x:visible;row-gap:4px}.tab{min-height:38px;padding:8px 12px}}
.tab{flex:none;border:0;background:transparent;color:var(--muted);font:600 .95rem var(--f-body);padding:10px 14px;border-radius:999px;cursor:pointer;min-height:44px}
.tab[aria-current="page"]{background:var(--note);color:var(--note-ink)}
.tab .dot{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--coin);color:#1b1205;font-size:.75rem;line-height:20px;text-align:center}

main{max-width:1160px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
.cols{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:820px){.cols{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)} .cols.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.stack{display:grid;gap:20px;align-content:start;min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}

.accts{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.acct{position:relative;overflow:hidden;border-radius:16px;padding:18px;color:var(--note-ink);background:var(--note);min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;box-shadow:0 8px 24px var(--shade)}
.acct.sav{background:var(--coin);color:#1b1205}
.acct::before{content:"";position:absolute;inset:0;opacity:.18;pointer-events:none;
  background:repeating-radial-gradient(circle at 100% 0%,transparent 0 9px,currentColor 9px 10px),repeating-radial-gradient(circle at 0% 120%,transparent 0 13px,currentColor 13px 14px)}
.acct>*{position:relative}
.acct .k{font-size:.75rem;text-transform:uppercase;letter-spacing:.14em;font-weight:700;opacity:.85;display:flex;justify-content:space-between;gap:8px}
.acct .v{font-family:var(--f-num);font-size:clamp(1.8rem,5vw,2.4rem);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.acct .s{font-size:.85rem;opacity:.9}

.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card)}
.stat b{display:block;font-family:var(--f-num);font-size:1.4rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}

.list{display:grid}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .main{flex:1;min-width:0}
.li .main b{display:block;font-weight:600;overflow-wrap:anywhere}
.li .main small{color:var(--muted);font-size:.82rem}
.li .amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.badge{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;font-weight:700;font-size:.8rem;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.good{color:var(--good)} .pill.bad{color:var(--bad)} .pill.warn{color:var(--warn)} .pill.note{color:var(--note)} .pill.mute{color:var(--muted)}

form{display:grid;gap:12px;margin:0}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
label{display:grid;gap:5px;font-size:.85rem;font-weight:600;color:var(--muted)}
input,select,textarea{font:500 1rem var(--f-body);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
.btn{font:700 1rem var(--f-body);border:0;border-radius:12px;padding:12px 18px;min-height:46px;cursor:pointer;background:var(--note);color:var(--note-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--coin);color:#1b1205}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:.88rem;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inline{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.inline>label{flex:1 1 120px}

/* the check */
.check{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px;gap:16px;position:relative;
  background-image:repeating-linear-gradient(135deg,transparent 0 7px,var(--shade) 7px 8px);box-shadow:0 6px 20px var(--shade)}
.check-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.check-top b{font-family:var(--f-display);color:var(--ink);font-size:1.05rem}
.check label{color:var(--ink)}
.check input,.check select{background:transparent;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:8px 2px}
.sigline{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.sig{font-family:var(--f-sig);font-size:2rem;color:var(--note);border-bottom:1px solid var(--muted);min-width:180px;padding:0 8px;line-height:1.1}
.micr{font-family:var(--f-num);font-size:.8rem;color:var(--muted);letter-spacing:.1em}

.gauge-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.gauge{width:150px;height:auto;flex:none}
.score{font-family:var(--f-num);font-size:2.4rem;line-height:1}

.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
td.num{white-space:nowrap}

.pick{max-width:860px;margin:0 auto;display:grid;gap:22px;padding-block:24px}
.people{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.person{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:18px 14px;display:grid;justify-items:center;gap:10px;cursor:pointer;font:600 1.05rem var(--f-body);color:var(--ink);min-height:150px}
.person .av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:800 1.6rem var(--f-display);color:#fff}
.person small{color:var(--muted);font-weight:500;font-size:.82rem}
.person.bank{border-style:dashed}
.person.bank .av{background:var(--ink);color:var(--paper)}

.empty{border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted);text-align:center}
.shop{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;background:var(--paper)}
.awning{height:10px;border-radius:6px;background:repeating-linear-gradient(90deg,var(--note) 0 18px,var(--card) 18px 36px)}

.overlay{position:fixed;inset:0;background:rgba(5,15,12,.55);display:grid;place-items:center;z-index:20;padding:20px}
.dialog{background:var(--card);border-radius:18px;padding:22px;max-width:420px;width:100%;display:grid;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{min-height:60px;font:600 1.4rem var(--f-num);border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.dots{display:flex;gap:14px;justify-content:center}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--note)}
.dots i.on{background:var(--note)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-weight:600;z-index:30;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.err{background:var(--bad);color:#fff}
.center{min-height:60vh;display:grid;place-items:center;text-align:center;padding:20px}
@media (prefers-reduced-motion:no-preference){.acct,.panel{animation:rise .3s ease-out both}@keyframes rise{from{transform:translateY(6px)}to{transform:none}}}
.daychip{font-family:var(--f-num);font-size:.8rem;padding:2px 8px;border-radius:999px;background:var(--coin);color:#1b1205;margin-right:6px;white-space:nowrap}
.alert{border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--card));border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.alert.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.cal{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.bigday{font-family:var(--f-display);font-weight:800;font-size:3.4rem;line-height:1}
select.tipsel{width:auto;min-height:40px;padding:6px 8px}
.alert.news{border-color:var(--note);background:color-mix(in srgb,var(--note) 10%,var(--card))}
.alert.sale{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--card))}
s.muted{font-size:.85em}
.msgs{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:820px){.msgs{grid-template-columns:minmax(0,320px) minmax(0,1fr)} .show-narrow{display:none!important}}
@media (max-width:819px){.hide-narrow{display:none!important}}
.convo{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;font:inherit;color:inherit;cursor:pointer;padding:11px 8px;border-radius:0}
.convo.on{background:var(--paper);border-radius:10px}
.convo .dot{min-width:22px;padding:0 6px;border-radius:999px;background:var(--coin);color:#1b1205;font-size:.75rem;line-height:22px;text-align:center;font-weight:700}
.thread{display:flex;flex-direction:column;gap:8px;max-height:55vh;min-height:200px;overflow-y:auto;padding:4px}
.bub{max-width:80%;align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px;display:grid;gap:2px;overflow-wrap:anywhere}
.bub.mine{align-self:flex-end;background:var(--note);color:var(--note-ink);border-color:transparent;border-radius:14px 14px 4px 14px}
.bub small{font-size:.72rem;opacity:.75}
.compose{display:flex;gap:8px;grid-template-columns:none}
.compose input{flex:1}
.lotto{background:var(--coin);color:#1b1205;border-color:transparent}
.lotto .eyebrow{color:#1b1205;opacity:.8}
.problem{font-family:var(--f-num);font-size:1.3rem;font-weight:500}
.paper{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px;display:grid;gap:16px;box-shadow:0 6px 20px var(--shade)}
.masthead{text-align:center;border-bottom:3px double var(--ink);padding-bottom:10px;display:grid;gap:4px}
.masthead h1{font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:-.01em;font-size:clamp(1.8rem,6vw,3rem)}
.dateline{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);border-bottom:1px solid var(--ink);padding-bottom:6px}
.headline{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.5rem,4.5vw,2.3rem);line-height:1.1;text-wrap:balance}
.deck{font-family:Georgia,serif;font-size:1.05rem;color:var(--muted)}
.newscols{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:820px){.newscols{grid-template-columns:repeat(3,minmax(0,1fr))}.newscols>.wide{grid-column:span 2}}
.newscols section{display:grid;gap:8px;align-content:start;min-width:0}
.newscols h3{font-family:Georgia,serif;font-size:1.05rem;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--ink);padding-bottom:4px}
.story{font-family:Georgia,serif;font-size:.98rem;line-height:1.5;overflow-wrap:anywhere}
.story b{font-family:var(--f-body)}
.weather{display:flex;gap:12px;align-items:center}
.weather .t{font-family:var(--f-num);font-size:2rem}
.balls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ball{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font:700 1.35rem var(--f-num);background:radial-gradient(circle at 35% 30%,#fff 0 12%,var(--coin) 13% 100%);color:#1b1205;box-shadow:0 4px 10px var(--shade)}
.ball.hidden{background:var(--paper);color:var(--muted);border:2px dashed var(--line);box-shadow:none}
.ball.sm{width:34px;height:34px;font-size:.9rem}
.ball.hit{background:radial-gradient(circle at 35% 30%,#fff 0 12%,var(--good) 13% 100%);color:#fff}
.ball.miss{background:var(--paper);color:var(--muted);border:1px solid var(--line);box-shadow:none}
@media (prefers-reduced-motion:no-preference){.ball.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}@keyframes pop{from{transform:scale(.2) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}}
.numgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;max-width:420px}
.numgrid button{min-height:48px;border-radius:50%;aspect-ratio:1;border:2px solid var(--line);background:var(--paper);color:var(--ink);font:700 1.1rem var(--f-num);cursor:pointer;max-width:100%}
.numgrid button.on{background:var(--coin);border-color:var(--coin);color:#1b1205}
.scratch{display:flex;gap:10px}
.scratch button{width:72px;height:72px;border-radius:12px;border:0;font:700 2rem var(--f-body);cursor:pointer;background:repeating-linear-gradient(45deg,#B8BEC2 0 6px,#A4ABB0 6px 12px);color:transparent}
.scratch button.done{background:var(--paper);color:var(--ink);border:2px solid var(--line);cursor:default}
</style>

  const p = S.players[pid] || {};
  let w = bal(b, pid, 'c') + bal(b, pid, 's');
  w += cdsOf(pid).filter(c => c.status === 'open').reduce((s, c) => s + c.amount, 0);
  w += holdingsOf(pid).reduce((s, h) => s + h.shares * sharePrice(h.shopId), 0);
  if (p.home && p.home.mode !== 'rent') w += p.home.price - (p.home.mode === 'mortgage' ? (p.home.balance || 0) : 0);
  w -= loansOf(pid).filter(l => l.status === 'active').reduce((s, l) => s + l.balance, 0);
  return w;
}

function credit(pid) {
  const p = S.players[pid] || {};
  let paid = 0, pays = 0, missed = 0, owed = 0;
  for (const l of loansOf(pid)) {
    if (l.status === 'paid') paid++;
    if (l.status === 'active') owed += l.balance || 0;
    pays += l.payments || 0; missed += l.missed || 0;
  }
  const foreclosed = Number(p.foreclosures || 0);
  const bs = billsOf(pid);
  const onTime = bs.filter(b => b.status === 'paid').length;
  const late = bs.filter(b => b.status === 'late' || b.status === 'paidLate').length;
  const base = Math.max(5000, (p.wage || 0) * 3);
  let score = 620 + paid * 40 + Math.min(100, pays * 6) + Math.min(60, onTime * 5) - missed * 60 - late * 30 - foreclosed * 100 - Math.round(Math.min(1, owed / base) * 80);
  score = Math.max(300, Math.min(850, score));
  const band = score >= 750 ? ['Excellent', 'good'] : score >= 670 ? ['Good', 'note'] : score >= 580 ? ['Fair', 'warn'] : ['Needs work', 'bad'];
  const mult = score >= 750 ? 2 : score >= 670 ? 1.5 : score >= 580 ? 1 : .5;
  const limit = Math.round(base * mult);
  return {score, band, limit, owed, avail: Math.max(0, limit - owed), paid, pays, missed, onTime, late, foreclosed};
}
function gauge(score, cls) {
  const f = (score - 300) / 550, a = Math.PI * (1 - f), r = 48;
  const x = 60 + r * Math.cos(a), y = 60 - r * Math.sin(a);
  return `<svg class="gauge" viewBox="0 0 120 68" aria-hidden="true">
    <path d="M12 60 A48 48 0 0 1 108 60" fill="none" stroke="var(--line)" stroke-width="10" stroke-linecap="round"/>
    ${f > 0.005 ? `<path d="M12 60 A48 48 0 0 1 ${x.toFixed(1)} ${y.toFixed(1)}" fill="none" stroke="var(--${cls})" stroke-width="10" stroke-linecap="round"/>` : ''}
    <text x="12" y="67" font-size="7" fill="var(--muted)" text-anchor="middle">300</text>
    <text x="108" y="67" font-size="7" fill="var(--muted)" text-anchor="middle">850</text></svg>`;
}

const KIND = {pay:'Paycheck', check:'Check', move:'Savings transfer', purchase:'Purchase', meal:'Restaurant', refund:'Refund', loan:'Loan', repay:'Loan payment', interest:'Interest', adjust:'From the bank', bill:'Bill', lottery:'Lottery', job:'Odd job', biz:'Business', hotel:'Hotel', reverse:'Reversal', supply:'Cost of goods', dividend:'Profit share', needs:'Daily needs', stamps:'Stamp reward', escrow:'Request', rent:'Rent', home:'Home', stock:'Stocks', cash:'Cash', cd:'CD', event:'Town event'};
function txRows(list, pid, limit = 15, canReverse = false) {
  const rows = list.slice(0, limit).map(t => {
    let delta = null; const title = t.memo || KIND[t.kind] || 'Transaction';
    if (pid) {
      const out = t.from.startsWith(pid + '.'), inn = t.to.startsWith(pid + '.');
      delta = (out && inn) ? null : (inn ? t.amount : -t.amount);
    }
    const who = pid
      ? (t.kind === 'move' ? (t.to.endsWith('.s') ? 'Checking → Savings' : 'Savings → Checking')
        : (t.to.startsWith(pid + '.') ? 'From ' + nameOf(t.from.split('.')[0]) : 'To ' + nameOf(t.to.split('.')[0])))
      : nameOf(t.from.split('.')[0]) + ' → ' + nameOf(t.to.split('.')[0]);
    const amt = delta === null ? `<span class="amt">${money(t.amount)}</span>` : `<span class="amt ${delta > 0 ? 'pos' : 'neg'}">${money(delta, true)}</span>`;
    const rev = t.reversed ? ' <span class="pill mute" style="font-size:.7rem;padding:1px 7px">Reversed</span>' : '';
    const btn = canReverse && !t.reversed && t.kind !== 'reverse' && t.from !== t.to ? `<button class="btn ghost sm" data-act="reverseTx" data-id="${t.id}">Reverse</button>` : '';
    return `<div class="li" ${t.reversed ? 'style="opacity:.6"' : ''}><span class="badge">${esc((KIND[t.kind] || 'Tx').slice(0, 3).toUpperCase())}</span>
      <div class="main"><b>${esc(title)}${rev}</b><small>${esc(who)} · ${t.day ? 'Day ' + t.day + ' · ' : ''}${when(t.at)}</small></div>${amt}${btn}</div>`;
  }).join('');
  return rows || `<div class="empty">No transactions yet.</div>`;
}

async function doLottery(day, patch) {
  const L = lotto(), all = lottoTickets(); if (!all.length) return '';
  const legacy = all.filter(t => !Array.isArray(t.numbers)), tickets = all.filter(t => Array.isArray(t.numbers));
  for (const t of legacy) await addTx('bank', t.playerId + '.c', t.price || 0, 'lottery', 'Refund for an old-style lottery ticket');
  const max = Math.max(4, every('pick3Max')), pot = lottoPot();
  const drawn = Array.from({length: max}, (_, i) => i + 1).sort(() => Math.random() - .5).slice(0, 3).sort((a, b) => a - b);
  const jack = tickets.filter(t => matchCount(t.numbers, drawn) === 3), two = tickets.filter(t => matchCount(t.numbers, drawn) === 2), one = tickets.filter(t => matchCount(t.numbers, drawn) === 1);
  const jp = jack.length ? Math.floor(pot / jack.length) : 0;
  for (const t of jack) await addTx('bank', t.playerId + '.c', jp, 'lottery', `JACKPOT! Matched all 3 in drawing #${L.drawNo}`, {day});
  for (const t of two) await addTx('bank', t.playerId + '.c', cfg('pick3Match2'), 'lottery', `Lottery: matched 2 in drawing #${L.drawNo}`, {day});
  for (const t of one) if (cfg('pick3Match1') > 0) await addTx('bank', t.playerId + '.c', cfg('pick3Match1'), 'lottery', `Lottery: matched 1 in drawing #${L.drawNo}`, {day});
  for (const pid of new Set(jack.map(t => t.playerId))) await sendMsg('bank', pid, `JACKPOT! The numbers were ${drawn.join(', ')} and you won ${money(jp)}!`, day);
  const nextCarry = jack.length ? cfg('pick3Seed') : pot + cfg('pick3Boost');
  patch.lottery = {v: 2, drawNo: L.drawNo + 1, carry: nextCarry};
  patch.lotteryHistory = [{drawNo: L.drawNo, day, numbers: drawn, tickets: tickets.length, pot, jackpotWinners: jack.map(t => t.playerId), prize: jp, small: two.length + one.length}, ...(S.settings.lotteryHistory || [])].slice(0, 10);
  const names = [...new Set(jack.map(t => nameOf(t.playerId)))].join(' and '), smalls = two.length + one.length, smallNames = [...new Set([...two, ...one].map(t => nameOf(t.playerId)))];
  patch.news = [{day, title: jack.length ? 'Lottery jackpot won!' : 'Lottery drawing', text: jack.length ? `The numbers were ${drawn.join(', ')}. ${names} won the ${money(pot)} jackpot!` : `The numbers were ${drawn.join(', ')}. No jackpot winner, so it grows to ${money(nextCarry)}.${smalls ? ` Smaller prizes went to ${smallNames.join(', ')}.` : ' No smaller prizes either.'}`}, ...(patch.news || S.settings.news || [])].slice(0, 12);
  return jack.length ? 'lottery jackpot won!' : 'lottery drawing';
}

async function doLicenses(day) {

async function advanceDay() {
  const d = today() + 1, patch = {}, done = [];
  { const r = await doNeeds(d); if (r) done.push(r); }
  const late = await markLate(d); if (late) done.push(late);
  const cd = await doCds(d); if (cd) done.push(cd);
  { const r = await doLicenses(d); if (r) done.push(r); }
  if (d % every('payEvery') === 0) { const r = await doPayday(patch); if (r) done.push(r); }
  if (d % every('billEvery') === 0) { const r = await doUtilities(d); if (r) done.push(r); }
  if (d % every('rentEvery') === 0) { const r = await doHousing(d); if (r) done.push(r); }
  if (d % every('interestEvery') === 0) { const r = await doInterest(patch); if (r) done.push(r); }
  if (d % every('lotteryEvery') === 0) { const r = await doLottery(d, patch); if (r) done.push(r); }
  { const r = await doStockStart(d); if (r) done.push(r); }
  { const r = await doHotels(d); if (r) done.push(r); }
  if (d % every('dividendEvery') === 0) { const r = await doDividends(d); if (r) done.push(r); }
  { const r = await doAudits(d); if (r) done.push(r); }
  if (!marketActive(d) && Math.random() * 100 < cfg('marketChance')) done.push(await startMarket(Math.random() < .5 ? 'boom' : 'crash', d, patch));
  { const r = await doGigs(d); if (r) done.push(r); }
  if (playerList().length && Math.random() * 100 < cfg('surpriseChance')) { const g = await sendSurprise([pickRandom(playerList())], d); done.push('surprise bill for ' + g[0].split(':')[0]); }
  if (Math.random() * 100 < cfg('eventChance')) { const r = await drawEvent(d, patch); if (r) done.push(r); }
  patch.day = d;
  if (S.settings.autoOn) patch.autoNextAt = Date.now() + Math.max(1, Math.round(cfg('autoMinutes'))) * 60000;
  await db.doc('town/settings').update(patch);
  toast(`Good morning, Day ${d}!` + (done.length ? ' ' + done.join(', ') + '.' : ''));
}
async function markLate(day) {
  const fee = Math.max(0, Math.round(cfg('lateFee'))); let n = 0;
  for (const b of S.bills.filter(b => b.status === 'due' && b.dueDay < day)) { await db.doc('bills/' + b.id).update({status: 'late', lateFee: fee, total: b.total + fee}); n++; }
  return n ? `${n} late bill${n > 1 ? 's' : ''}` : '';
}
async function drawEvent(day, patch) {
  const ps = playerList(); if (!ps.length) return '';
  const ev = pickRandom(EVENTS), p = pickRandom(ps);
  if (ev.e === 'boom' || ev.e === 'crash') return startMarket(ev.e, day, patch);
  const text = ev.x.replace('{a}', money(ev.a)).replace('{p}', p.name);
  if (ev.e === 'bonusAll') for (const q of ps) await addTx('bank', q.id + '.c', ev.a, 'event', ev.t);
  if (ev.e === 'billAll') for (const q of ps) await addBill(q.id, 'event', ev.t, [{name: ev.t, amount: ev.a}], day);
  if (ev.e === 'bonusOne') await addTx('bank', p.id + '.c', ev.a, 'event', ev.t);
  if (ev.e === 'takeOne') await addTx(p.id + '.c', 'bank', ev.a, 'event', ev.t);
  if (ev.e === 'billOne') await addBill(p.id, 'event', ev.t, [{name: ev.t, amount: ev.a}], day);
  if (ev.e === 'savings') patch.savingsBoost = ev.a;
  if (ev.e === 'payBonus') patch.payBonus = ev.a;
  patch.event = {title: ev.t, text, day, untilDay: day, effect: ev.e, value: ev.a};
  patch.news = [{day, title: ev.t, text}, ...(patch.news || S.settings.news || [])].slice(0, 12);
  return 'town news: ' + ev.t;
}

function shell(isBank) {
  const myOrders = S.orders.filter(o => o.sellerId === S.me && o.status === 'new').length;
  const bankQueue = waitingTeller().length + Object.values(S.loans).filter(l => l.status === 'requested').length;
  const myWaiting = tellerOf(S.me).filter(t => t.status === 'waiting').length + loansOf(S.me).filter(l => l.status === 'requested').length;
  const tabs = isBank
    ? [['town','Town'],['paper','Gazette'],['calendar','Day & schedule'],['teller','Teller window', bankQueue],['jobs','Odd jobs', S.gigs.filter(g => g.status === 'review' && g.kind !== 'request').length],['hotel','Bank businesses', S.orders.filter(o => o.sellerId === 'bank' && o.status === 'new').length],['inspector','Inspector', Object.values(S.shops).filter(sh => sh.ownerId !== 'bank').filter(sh => sh.renewalRequested || inspOverdue(sh) || sh.inspection?.nextDue === today()).length],['messages','Messages', unreadTotal()],['people','Residents'],['shops','Businesses'],['settings','Settings']]
    : [['home','Accounts'],['paper','Gazette'],['messages','Messages', unreadTotal()],['bills','Bills', openBills(S.me).length],['jobs','Odd jobs', activeGigs(S.me).filter(g => g.status === 'claimed').length + S.gigs.filter(g => g.kind === 'request' && g.postedBy === S.me && g.status === 'review').length],['housing','Housing'],['pay','Write a check'],['shop','Main Street'],...(auditPending(S.me) ? [['audit','Tax audit', 1]] : auditOf(S.me)?.doneDay === today() ? [['audit','Tax audit']] : []),['myshop','My businesses', (bizCount(S.me) > bizLimit() ? 1 : 0) + Object.values(S.shops).filter(sh => sh.ownerId === S.me).reduce((a, sh) => a + lowStock(sh).filter(i => i.stock === 0).length, 0) + myOrders + Object.values(S.shops).filter(sh => sh.ownerId === S.me && ['Today', 'Overdue'].includes(inspNotice(sh)?.short)).length],['stocks','Stocks'],['lottery','Lottery', ((() => { const l = (S.settings.lotteryHistory || [])[0]; return l && l.numbers && l.drawNo > Number(ls('ptb.lotto.seen.' + S.me) || 0) && S.lottoTickets.some(t => t.drawNo === l.drawNo && t.playerId === S.me) ? 1 : 0; })()) + S.lottoTickets.filter(t => t.kind === 'scratch' && t.playerId === S.me && !t.done).length],['bank','Bank & credit', myWaiting]];
  if (!tabs.some(t => t[0] === S.tab)) S.tab = tabs[0][0];
  const who = isBank ? 'Banker mode' : nameOf(S.me) + (S.players[S.me]?.job ? ' · ' + S.players[S.me].job : '');
  const content = isBank ? bankView() : playerView();
  return `<header class="top"><div class="top-in">
      <span class="seal">${initial(S.settings.name)}</span>
      <div class="brand"><b>${esc(S.settings.name)} Bank</b><span><span class="daychip">Day ${today()}${S.settings.autoOn && S.settings.autoNextAt ? ' · next in ' + Math.max(0, Math.ceil((S.settings.autoNextAt - Date.now()) / 60000)) + 'm' : ''}</span>${esc(who)}</span></div>
      <button class="btn ghost sm" data-act="switch">Switch person</button></div>
    <nav class="tabs" aria-label="Sections">${tabs.map(([k, l, n]) => `<button class="tab" data-act="tab" data-id="${k}" ${S.tab === k ? 'aria-current="page"' : ''}>${l}${n ? `<span class="dot">${n}</span>` : ''}</button>`).join('')}</nav>
  </header><main>${content}</main>`;
}

// ---------- player views ----------
function billCard(b, canPay) {
  const late = b.status === 'late', paid = b.status === 'paid' || b.status === 'paidLate';
  const pill = paid ? (b.status === 'paidLate' ? ['Paid late', 'warn'] : ['Paid on time', 'good']) : late ? ['Late', 'bad'] : (b.dueDay === today() ? ['Due today', 'warn'] : ['Due ' + dayIn(b.dueDay), 'note']);
  return `<div class="shop"><div class="panel-head"><b>${esc(b.label || 'Utilities')} · Day ${b.issuedDay}</b>${b.payTo ? `<small class="muted" style="display:block">Paid to ${esc(nameOf(b.payTo))}</small>` : ''}<span class="pill ${pill[1]}">${pill[0]}</span></div>
    <div class="list">${b.items.map(u => `<div class="li" style="padding:6px 0"><div class="main">${esc(u.name)}</div><span class="amt">${money(u.amount)}</span></div>`).join('')}
    ${b.lateFee ? `<div class="li" style="padding:6px 0"><div class="main neg">Late fee</div><span class="amt neg">${money(b.lateFee)}</span></div>` : ''}
    <div class="li" style="padding:6px 0"><div class="main"><b>Total</b></div><span class="amt"><b>${money(b.total)}</b></span></div></div>
    ${!paid && canPay ? `<div class="row"><button class="btn ${late ? '' : 'gold'}" data-act="payBill" data-id="${b.id}">Pay ${money(b.total)} from checking</button></div>` : ''}</div>`;
}

            return `<div class="li"><div class="main"><b>${esc(i.name)}</b><small>${T.hotel ? (out ? 'Fully booked' : `${free} of ${i.stock || 0} rooms free`) + ' · ' + (hotelDay(s.id) === today() ? 'tonight' : 'Day ' + hotelDay(s.id)) + ' · per night' : i.stock == null ? T.always : out ? 'Sold out' : i.stock + ' left'}</small></div>
              <span class="amt">${pct ? `<s class="muted">${money(i.price)}</s> <b class="neg">${money(priceNow(i, s))}</b>` : money(i.price)}</span>
              ${out || !isOpenBiz(s) ? '' : `<input id="q-${i.id}" type="number" min="1" value="1" style="width:70px;min-height:40px;padding:6px 8px" aria-label="Quantity"><button class="btn sm" data-act="buy" data-id="${i.id}">${T.buy}</button>`}</div>`;
          }).join('') : `<div class="empty">Nothing on the ${T.list.toLowerCase()} yet.</div>`}</div></section>`;
      }).join('') : '<div class="empty">No other businesses are open yet. Open your own under My businesses.</div>'}
    </div><div class="stack"><section class="panel"><h3>Your orders</h3><div class="list">${mine.length ? mine.map(o => {
      const T = bizOf(o.bizType);
      const st = o.status === 'new' ? ['Ordered', 'warn'] : o.status === 'done' ? [T.done, 'good'] : ['Refunded', 'mute'];
      return `<div class="li"><div class="main"><b>${o.qty} × ${esc(o.itemName)}</b><small>${esc(S.shops[o.shopId]?.name || 'Closed')} · ${o.day ? 'Day ' + o.day : when(o.at)}${o.stayDay ? ' · night of Day ' + o.stayDay : ''}${o.salePct ? ' · ' + o.salePct + '% off' : ''}${o.tip ? ' · tip ' + money(o.tip) : ''}</small></div><span class="pill ${st[1]}">${st[0]}</span><span class="amt">${money(o.total)}</span></div>`;
    }).join('') : '<div class="empty">You haven’t ordered anything.</div>'}</div></section></div></div>`;
  }
  if (S.tab === 'myshop') {
    const mine = Object.values(S.shops).filter(s => s.ownerId === pid);
    const free = Object.keys(BIZ).filter(t => !BIZ[t].bankOnly && !mine.some(s => bizType(s) === t)), lim = bizLimit();
    const chooser = mine.length > lim ? `<section class="panel" style="border:2px solid var(--bad)"><h2>Choose ${mine.length - lim === 1 ? 'a business' : mine.length - lim + ' businesses'} to close</h2>
      <p>The town now lets each resident run up to <b>${lim}</b> businesses. You have <b>${mine.length}</b>, so you need to close ${mine.length - lim}. You get to choose which. Look at sales and inspection grades to decide.</p>
      <div class="list">${mine.map(sh => { const sold = S.orders.filter(o => o.shopId === sh.id && o.status !== 'refunded').reduce((a, o) => a + o.total, 0); return `<div class="li"><div class="main"><b>${esc(sh.name)}</b><small>${BIZ[bizType(sh)].Noun} · ${money(sold)} in sales${sh.inspection?.grade ? ' · grade ' + sh.inspection.grade : ''}</small></div><button class="btn danger sm" data-act="closeShop" data-id="${sh.id}">Close this one</button></div>`; }).join('')}</div>
      <p class="muted" style="font-size:.85rem">Closing a business takes it off Main Street for good. You don’t get the opening fee back.</p></section>` : '';
    const atLimit = mine.length >= lim;
    return chooser + mine.map(manageBiz).join('<hr style="border:0;border-top:2px dashed var(--line);margin:8px 0;width:100%">') + (atLimit ? `<section class="panel" style="max-width:680px"><p class="muted">You’re running ${mine.length} business${mine.length > 1 ? 'es' : ''}, and the town limit is ${lim}. To open a different one, close one first.</p></section>` : free.length ? `<section class="panel" style="max-width:680px"><h3>${mine.length ? 'Open another business' : 'Open a business'}</h3>
      <p class="muted">You can run one of each kind. Opening one costs a license and setup fee from your checking. Short on money? Ask the bank for a loan.</p>
      <form data-form="openBiz"><label>Kind of business<select id="ob-type">${free.map(t => `<option value="${t}">${BIZ[t].Noun} · ${money(bizCost(t))} to open · ${esc(BIZ[t].blurb)}</option>`).join('')}</select></label>
      <label>Name<input id="ob-n" required maxlength="40" placeholder="${esc(BIZ[free[0]].ph)}"></label>
      <label>What will you offer?<input id="ob-d" maxlength="100" placeholder="${esc(BIZ[free[0]].php)}"></label><div><button class="btn">Open for business</button></div></form></section>` : '');
  }
  if (S.tab === 'stocks') {
    const bizs = Object.values(S.shops);
    const mine = holdingsOf(pid);
    const value = mine.reduce((s, h) => s + h.shares * sharePrice(h.shopId), 0), cost = mine.reduce((s, h) => s + (h.cost || 0), 0);
    return `<div class="cols"><div class="stack">
      <div><p class="eyebrow">Town Stock Exchange · Day ${today()}</p><h2>The market</h2></div>
      ${marketNow() ? `<div class="alert ${marketNow().cls === 'bad' ? 'bad' : 'news'}"><span><b>${esc(marketNow().text)}</b></span></div>` : newsBanner()}
      <section class="panel">${bizs.length ? `<div class="tbl-wrap"><table><thead><tr><th>Business</th><th class="r">Price</th><th class="r">Today</th><th>Last 7 days</th><th class="r">Shares left</th><th class="r">Profit share</th><th></th></tr></thead><tbody>
        ${bizs.map(s => { const pNow = sharePrice(s.id), pPrev = sharePrice(s.id, Math.max(1, today() - 1)), ch = pPrev ? (pNow - pPrev) / pPrev * 100 : 0, left = SHARES - sharesOut(s.id), own = s.ownerId === pid;
          return `<tr><td><b>${esc(s.name)}</b><br><small class="muted">${BIZ[bizType(s)].Noun} · ${esc(nameOf(s.ownerId))}</small></td><td class="r num">${money(pNow)}</td>
          <td class="r num ${ch > 0 ? 'pos' : ch < 0 ? 'neg' : 'muted'}">${ch > 0 ? '▲' : ch < 0 ? '▼' : '–'} ${Math.abs(ch).toFixed(1)}%</td><td>${spark(s.id)}</td><td class="r">${left}</td><td class="r"><small>${s.lastDividend ? (s.lastDividend.perShare ? money(s.lastDividend.perShare) + '/share' : 'none') + ' last time' : 'not yet'}<br><span class="muted">so far: ~${money(Math.round(perSharePreview(s.id)))}/share</span></small></td>
          <td class="r">${own ? '<small class="muted">Your business</small>' : left > 0 ? `<div class="row" style="justify-content:flex-end;flex-wrap:nowrap"><input id="sb-${s.id}" type="number" min="1" max="${left}" value="1" style="width:64px;min-height:38px;padding:6px" aria-label="Shares"><button class="btn sm" data-act="buyStock" data-id="${s.id}">Buy</button></div>` : '<small class="muted">Sold out</small>'}</td></tr>`; }).join('')}
        </tbody></table></div>` : '<div class="empty">No businesses to invest in yet.</div>'}</section>
    </div><div class="stack">
      <section class="panel"><h3>Your portfolio</h3>
        <div class="stats"><div class="stat"><b>${money(value)}</b><span>Worth now</span></div><div class="stat"><b class="${value - cost >= 0 ? 'pos' : 'neg'}">${money(value - cost, true)}</b><span>Gain or loss</span></div><div class="stat"><b class="pos">${money(dividendsOf(pid))}</b><span>Profit sharing earned</span></div></div>
        <p class="muted" style="font-size:.85rem">Next profit sharing: <b>${dayIn(nextOn('dividendEvery'))}</b>.</p>
        <div class="list">${mine.length ? mine.map(h => { const pr = sharePrice(h.shopId), v = h.shares * pr, g = v - (h.cost || 0);
          return `<div class="li"><div class="main"><b>${esc(S.shops[h.shopId]?.name || 'Closed business')}</b><small>${h.shares} share${h.shares > 1 ? 's' : ''} · paid ${money(h.cost)} · now ${money(v)} <span class="${g >= 0 ? 'pos' : 'neg'}">(${money(g, true)})</span></small></div>
            <input id="ss-${h.shopId}" type="number" min="1" max="${h.shares}" value="${h.shares}" style="width:64px;min-height:38px;padding:6px" aria-label="Shares to sell"><button class="btn ghost sm" data-act="sellStock" data-id="${h.shopId}">Sell</button></div>`; }).join('') : '<div class="empty">You don’t own any shares yet.</div>'}</div></section>
      <section class="panel"><h3>How the market works</h3><p class="muted">Every business has ${SHARES} shares. A share starts around ${money(Math.round(10000 / SHARES))}. Over time the price follows how much the business sells over the last 7 days. Prices also bounce up and down a little every day for no clear reason, just like real stocks, and some days the whole market moves together. A good business can still have a bad day. Buy shares in businesses you believe in, and don’t panic over one bad day. Town news can move every price too.</p><p class="muted"><b>Profit sharing:</b> every ${every('dividendEvery')} days, shareholders get ${cfg('profitShare')}% of each business’s profit (sales minus what it spent on stock), split across its ${SHARES} shares. Own more shares in busy businesses, earn more.</p></section>
    </div></div>`;
  }
  if (S.tab === 'bank') {
    const cr = credit(pid), loans = loansOf(pid), reqs = tellerOf(pid).sort((a, c) => c.at - a.at).slice(0, 10), cds = cdsOf(pid).sort((a, c) => c.openDay - a.openDay);
    const st = {requested: ['Waiting for banker', 'warn'], active: ['Active', 'note'], paid: ['Paid off', 'good'], declined: ['Declined', 'mute'], settled: ['Settled by foreclosure', 'bad']};
    const TK = {withdraw: 'Cash withdrawal', deposit: 'Cash deposit', cd: 'Open a CD', cdclose: 'Cash out CD early', mortgage: 'Mortgage application'};
    const cdPay = Math.round(10000 * (100 + cfg('cdRate')) / 100);
    return `<div class="cols"><div class="stack">
      <section class="panel"><div class="panel-head"><h3>Teller window</h3><span class="pill note">In person</span></div>
        <p class="muted">These need a visit to the banker. Send the request, then go to the bank. The banker hands you cash, takes your cash, or opens your account.</p>
        <form class="inline" data-form="tellerReq" data-id="withdraw"><label>Withdraw cash from checking<input id="tw-amt" inputmode="decimal" placeholder="0.00" required></label><button class="btn">Request</button></form>
        <form class="inline" data-form="tellerReq" data-id="deposit"><label>Deposit cash<input id="td-amt" inputmode="decimal" placeholder="0.00" required></label><label style="flex:0 1 150px">Into<select id="td-acct"><option value="c">Checking</option><option value="s">Savings</option></select></label><button class="btn">Request</button></form>
        <form class="inline" data-form="tellerReq" data-id="cd"><label>Open a CD (${cfg('cdRate')}% for ${every('cdDays')} days)<input id="tc-amt" inputmode="decimal" placeholder="0.00" required></label><button class="btn gold">Request</button></form>
        <p class="muted" style="font-size:.85rem">A CD (certificate of deposit) locks your money away. ${money(10000)} becomes ${money(cdPay)} in ${every('cdDays')} days. Cash out early and you lose the interest plus ${cfg('cdPenalty')}%.</p>
        ${reqs.length ? `<div class="list">${reqs.map(r => `<div class="li"><div class="main"><b>${TK[r.kind]}${r.amount ? ' · ' + money(r.amount) : ''}</b><small>Day ${r.day}${r.status === 'waiting' ? ' · go see the banker' : ''}</small></div><span class="pill ${r.status === 'waiting' ? 'warn' : r.status === 'done' ? 'good' : 'mute'}">${r.status === 'waiting' ? 'Waiting' : r.status === 'done' ? 'Done' : 'Declined'}</span>${r.status === 'waiting' ? `<button class="btn ghost sm" data-act="cancelTeller" data-id="${r.id}">Cancel</button>` : ''}</div>`).join('')}</div>` : ''}
      </section>
      <section class="panel"><h3>Your CDs</h3>${cds.length ? `<div class="list">${cds.map(c => `<div class="li"><div class="main"><b>${money(c.amount)} → ${money(c.payout)}</b><small>Opened Day ${c.openDay} · ${c.status === 'open' ? 'matures ' + dayIn(c.matureDay) : c.status === 'matured' ? 'paid out' : 'cashed out early'}</small></div>
        ${c.status === 'open' ? `<button class="btn ghost sm" data-act="cdEarly" data-id="${c.id}">Cash out early</button>` : `<span class="pill ${c.status === 'matured' ? 'good' : 'mute'}">${c.status === 'matured' ? 'Matured' : 'Closed'}</span>`}</div>`).join('')}</div>` : '<div class="empty">No CDs yet.</div>'}</section>
      <section class="panel"><h3>Your loans</h3>${loans.length ? loans.map(l => `<div class="shop">
        <div class="panel-head"><b>${esc(l.purpose || 'Loan')} · ${money(l.amount)}</b><span class="pill ${st[l.status][1]}">${st[l.status][0]}</span></div>
        ${l.status === 'active' ? `<p>Still owe <b class="num">${money(l.balance)}</b> · ${l.rate}% interest every ${every('interestEvery')} days · interest so far <span class="num">${money(l.interest || 0)}</span></p>
          <form class="inline" data-form="repay" data-id="${l.id}"><label>Pay back<input id="rp-${l.id}" inputmode="decimal" placeholder="${(Math.min(l.balance, Math.max(0, bal(b, pid, 'c'))) / 100).toFixed(2)}" required></label><button class="btn gold">Make payment</button></form>`
        : `<small class="muted">${when(l.at)}${l.status === 'paid' ? ` · paid ${money(l.interest || 0)} in interest` : ''}</small>`}</div>`).join('') : '<div class="empty">No loans yet.</div>'}
        <h3 style="margin-top:6px">Ask for a loan</h3><p>You can borrow up to <b class="num">${money(cr.avail)}</b> right now at <b>${cfg('loanRate')}%</b> every ${every('interestEvery')} days.</p>
        <form data-form="request"><div class="fields"><label>Amount<input id="lr-amt" inputmode="decimal" required placeholder="0.00"></label>
          <label>What’s it for?<input id="lr-why" maxlength="50" required placeholder="Supplies for my shop"></label></div>
          <div><button class="btn" ${cr.avail <= 0 ? 'disabled' : ''}>Send to the banker</button></div></form></section>
    </div><div class="stack">
      <section class="panel"><div class="gauge-wrap">${gauge(cr.score, cr.band[1])}<div style="display:grid;gap:4px"><p class="eyebrow">Your credit score</p><div class="score num">${cr.score}</div><span class="pill ${cr.band[1]}">${cr.band[0]}</span></div></div>
        <div class="stats">
          <div class="stat"><b>${cr.paid}</b><span>Loans paid off (+40 each)</span></div>
          <div class="stat"><b>${cr.pays}</b><span>Loan payments (+6 each)</span></div>
          <div class="stat"><b>${cr.onTime}</b><span>Bills paid on time (+5 each)</span></div>
          <div class="stat"><b>${cr.late}</b><span>Late bills (−30 each)</span></div>
          <div class="stat"><b>${cr.missed}</b><span>Missed loan payments (−60 each)</span></div>
          ${cr.foreclosed ? `<div class="stat"><b class="neg">${cr.foreclosed}</b><span>Businesses foreclosed (−100 each)</span></div>` : ''}
          <div class="stat"><b>${money(cr.owed)}</b><span>Owed of ${money(cr.limit)} limit</span></div></div>
        <p class="muted" style="font-size:.88rem">Scores run 300 to 850. You need at least 580 for a mortgage. Paying bills and loans on time raises it. Late bills, missed payments, or borrowing close to your limit lower it.</p></section>
    </div></div>`;
  }
  return '';
}

function auditView() {
  const pid = S.me, a = auditOf(pid);
  if (!a) return '<div class="empty">No audit right now.</div>';
  const done = a.problems.filter(p => p.given != null), cur = a.problems[a.idx];
  const rows = done.map((p, i) => `<div class="li"><span class="badge" style="${p.ok ? 'color:var(--good)' : 'color:var(--bad)'}">${p.ok ? '✓' : '✗'}</span><div class="main"><b>${esc(p.q)}</b><small>You said ${esc(String(p.given))}${p.ok ? '' : ' · correct answer: ' + p.a}</small></div></div>`).join('');
  return `<div class="cols"><div class="stack">
    <section class="panel"><div class="panel-head"><div><p class="eyebrow">Town Tax Office</p><h2>Surprise tax audit</h2></div><span class="pill ${a.status === 'pending' ? 'warn' : a.status === 'passed' ? 'good' : a.status === 'fined' ? 'warn' : 'bad'}">${a.status === 'pending' ? `Question ${Math.min(a.idx + 1, AUDIT_N)} of ${AUDIT_N}` : a.status === 'passed' ? 'Clean audit' : a.status === 'fined' ? 'Passed, fined' : 'Failed'}</span></div>
      <p class="muted" style="font-size:.88rem">Pass by getting at least ${passMark()} of ${AUDIT_N} right. Strikes: <b class="${strikesOf(pid) ? 'neg' : ''}">${strikesOf(pid)} of 2</b>. Two failed audits and the town takes one of your businesses.</p>
      ${a.status === 'pending' && cur ? `<p class="muted">Due by the end of ${a.dueDay === today() ? 'today' : 'Day ' + a.dueDay}. You get one chance per problem. Each wrong answer is a ${money(cfg('auditFine'))} fine.</p>
        <p class="problem">${esc(cur.q)}</p>
        <form class="inline" data-form="auditAnswer"><label>Your answer<input id="au-ans" inputmode="decimal" required autocomplete="off"></label><button class="btn gold">Submit answer</button></form>` : ''}
      ${a.status !== 'pending' ? `<p>${a.wrong ? `You got ${AUDIT_N - a.wrong} of ${AUDIT_N} right. Fine: <b>${money(a.fine)}</b>, sent to your Bills tab.` : `All ${AUDIT_N} right. The Tax Office is impressed!`}</p>
        ${a.lostShop ? `<div class="alert bad"><span><b>Second failed audit.</b> The town took ${esc(a.lostShop)}.</span></div>` : a.status === 'failed' ? `<div class="alert bad"><span><b>Strike 1 of 2.</b> Fail one more audit and the town takes one of your businesses.</span></div>` : ''}` : ''}
      ${rows ? `<div class="list">${rows}</div>` : ''}</section>
  </div><div class="stack"><section class="panel"><h3>What’s a tax audit?</h3><p class="muted">Business owners have to keep careful records and pay the right taxes. Sometimes the tax office checks those records to make sure the math adds up. Careful math means no fines. Fail two audits and you lose a business, the one with the lowest sales.</p></section></div></div>`;
}

function jobsView() {
  const pid = S.me, open = S.gigs.filter(g => g.status === 'open' && g.postedBy !== pid && !(g.failedBy || []).includes(pid)).sort((a, c) => c.pay - a.pay);
  const failed = S.gigs.filter(g => (g.status === 'failed' && g.claimedBy === pid) || (g.failedBy || []).includes(pid)).length;
  const mine = activeGigs(pid), full = mine.length >= 2;
  const done = S.gigs.filter(g => g.claimedBy === pid && g.status === 'paid').sort((a, c) => (c.paidAt || 0) - (a.paidAt || 0));
  const earned = done.reduce((s, g) => s + g.pay, 0);
  const myCard = g => g.status === 'review'
    ? `<div class="shop"><div class="panel-head"><b>${esc(g.title)}</b><span class="pill warn">Waiting for the banker</span></div><p class="muted">The banker will check your work and pay you ${money(g.pay)}.</p></div>`
    : g.kind === 'random'
    ? `<div class="shop"><div class="panel-head"><b>${esc(g.title)}</b><span class="row" style="gap:8px"><span class="pill ${TIER[tierFor(g.pay)][1]}">${TIER[tierFor(g.pay)][0]}</span><span class="amt pos">${money(g.pay)}</span></span></div><p class="muted">To finish the job, solve this:</p><p class="problem">${esc(g.q)}</p>
        <form class="inline" data-form="gigAnswer" data-id="${g.id}"><label>Your answer<input id="ga-${g.id}" inputmode="decimal" required autocomplete="off"></label><button class="btn gold">Finish job</button><button type="button" class="btn ghost" data-act="quitGig" data-id="${g.id}">Quit</button></form>
        <small class="${g.tries ? 'neg' : 'muted'}">${triesFor(pid) - (g.tries || 0)} of ${triesFor(pid)} tries left</small></div>`
    : `<div class="shop"><div class="panel-head"><b>${esc(g.title)}</b><span class="amt pos">${money(g.pay)}</span></div><p class="muted">${g.note ? (g.kind === 'request' ? esc(nameOf(g.postedBy)) : 'The banker') + ' says: ' + esc(g.note) + '. ' : ''}Do the job for real, then tap below. ${g.kind === 'request' ? esc(nameOf(g.postedBy)) + ' checks it' : 'The banker checks'} before paying.</p><div class="row"><button class="btn gold" data-act="finishGig" data-id="${g.id}">I finished</button><button class="btn ghost" data-act="quitGig" data-id="${g.id}">Quit</button></div></div>`;
  return `<div class="cols"><div class="stack">
    <div><p class="eyebrow">Odd jobs board · Day ${today()}</p><h2>Earn extra money</h2></div>
    ${mine.length ? `<section class="panel"><h3>Your jobs</h3>${mine.map(myCard).join('')}</section>` : ''}
    <section class="panel"><h3>Ask for help</h3><p class="muted" style="font-size:.88rem">Post a request and another resident can take it. Your money is held by the bank until you say the job is done.</p>
      <form class="inline" data-form="postRequest"><label>What do you need?<input id="rq-t" required maxlength="50" placeholder="Wash my bike"></label><label style="flex:0 1 120px">You’ll pay<input id="rq-p" inputmode="decimal" required placeholder="3.00"></label><button class="btn">Post</button></form>
      ${myRequests(pid).length ? `<div class="list">${myRequests(pid).map(g => `<div class="li"><div class="main"><b>${esc(g.title)} · ${money(g.pay)}</b><small>${g.status === 'open' ? 'Waiting for someone to take it' : g.status === 'claimed' ? esc(nameOf(g.claimedBy)) + ' is working on it' : esc(nameOf(g.claimedBy)) + ' says it’s done. Check it!'}</small></div>
        ${g.status === 'open' ? `<button class="btn ghost sm" data-act="cancelReq" data-id="${g.id}">Cancel</button>` : g.status === 'review' ? `<button class="btn sm" data-act="approveReq" data-id="${g.id}">Done, pay them</button><button class="btn ghost sm" data-act="rejectReq" data-id="${g.id}">Not done yet</button>` : ''}</div>`).join('')}</div>` : ''}</section>
    <section class="panel"><h3>Jobs available</h3>${open.length ? `<div class="list">${open.map(g => `<div class="li"><span class="badge">${g.kind === 'random' ? 'JOB' : g.kind === 'request' ? 'ASK' : 'REAL'}</span><div class="main"><b>${esc(g.title)}</b><small>${g.kind === 'request' ? 'Request from ' + esc(nameOf(g.postedBy)) + ' · they check before paying' : g.kind === 'random' ? `<span class="pill ${TIER[tierFor(g.pay)][1]}" style="font-size:.7rem;padding:1px 7px">${TIER[tierFor(g.pay)][0]}</span> · gone after Day ` + g.expiresDay : 'A real task from the banker, checked before you’re paid'}</small></div><span class="amt pos">${money(g.pay)}</span><button class="btn sm" data-act="claimGig" data-id="${g.id}" ${full ? 'disabled' : ''}>Take it</button></div>`).join('')}</div>
      ${full ? '<p class="muted" style="font-size:.85rem">You have two jobs going. Finish one before taking another.</p>' : ''}` : '<div class="empty">No jobs right now. New ones show up every morning.</div>'}</section>
  </div><div class="stack">

function tattler(D) {
  const out = [], first = n => n.split(' ')[0];
  const orders = S.orders.filter(o => o.day === D && o.status !== 'refunded');
  const big = orders.slice().sort((a, b) => b.total - a.total)[0];
  if (big) out.push(`Spotted: <b>${esc(nameOf(big.buyerId))}</b> spending ${money(big.total)} on ${big.qty} × ${esc(big.itemName)} at ${esc(S.shops[big.shopId]?.name || 'a local business')}. ${big.qty > 2 ? 'Sources say they did not share.' : 'Treat yourself!'}`);
  const tipper = orders.filter(o => o.tip > 0).sort((a, b) => b.tip - a.tip)[0];
  if (tipper) out.push(`Big tipper alert: <b>${esc(nameOf(tipper.buyerId))}</b> left a ${money(tipper.tip)} tip at ${esc(S.shops[tipper.shopId]?.name || 'a restaurant')}. Servers everywhere are cheering.`);
  const stay = orders.filter(o => o.bizType === 'hotel')[0];
  if (stay) out.push(`Staycation! <b>${esc(nameOf(stay.buyerId))}</b> booked a ${esc(stay.itemName)} at ${esc(S.shops[stay.shopId]?.name || 'the hotel')}. Room service, anyone?`);
  const tx = S.tx.filter(t => t.day === D);
  const saver = tx.filter(t => t.kind === 'move' && t.to.endsWith('.s')).sort((a, b) => b.amount - a.amount)[0];
  if (saver) out.push(`Thrifty alert: <b>${esc(nameOf(saver.from.split('.')[0]))}</b> tucked ${money(saver.amount)} into savings. Our money reporter gives it two thumbs up.`);
  const check = tx.filter(t => t.kind === 'check').sort((a, b) => b.amount - a.amount)[0];
  if (check) out.push(`Money on the move: <b>${esc(nameOf(check.from.split('.')[0]))}</b> wrote <b>${esc(nameOf(check.to.split('.')[0]))}</b> a check for ${money(check.amount)}. The memo said “${esc((check.memo || '').slice(0, 40))}.” We have questions.`);
  const lotto = {}; tx.filter(t => t.kind === 'lottery' && t.from.endsWith('.c')).forEach(t => { const p = t.from.split('.')[0]; lotto[p] = (lotto[p] || 0) + 1; });
  const lucky = Object.entries(lotto).sort((a, b) => b[1] - a[1])[0];
  if (lucky && lucky[1] >= 2) out.push(`Feeling lucky? <b>${esc(nameOf(lucky[0]))}</b> bought ${lucky[1]} lottery tickets today. The odds have been notified.`);
  const trade = tx.filter(t => t.kind === 'stock' && /^Bought/.test(t.memo || '')).sort((a, b) => b.amount - a.amount)[0];
  if (trade) out.push(`Wall Street kid: <b>${esc(nameOf(trade.from.split('.')[0]))}</b> ${esc(trade.memo.charAt(0).toLowerCase() + trade.memo.slice(1))}. Bold move.`);
  const mover = tx.find(t => (t.kind === 'rent' && /^First rent/.test(t.memo || '')) || (t.kind === 'home' && /^(Bought|Down payment)/.test(t.memo || '')));
  if (mover) out.push(`Moving day! <b>${esc(nameOf(mover.from.split('.')[0]))}</b> has a new place: ${esc((mover.memo || '').replace(/^(First rent · |Bought the |Down payment on the )/, ''))}. Housewarming party when?`);
  const job = S.gigs.filter(g => g.status === 'paid' && g.paidDay === D && g.kind === 'random' && !g.tries)[0];
  if (job) out.push(`Hard worker of the day: <b>${esc(nameOf(job.claimedBy))}</b> finished “${esc(job.title)}” and nailed the math on the first try.`);
  const placed = S.tx.filter(t => t.kind === 'rent' && t.day === D && /placed by the town/.test(t.memo || '')).length;
  if (placed) out.push(`Moving trucks spotted! The town found ${placed === 1 ? 'a resident' : placed + ' residents'} a place to live after they forgot to pick one. Home sweet (cheapest) home.`);
  const late = S.bills.filter(b => b.lateFee && b.dueDay === D - 1).length;
  if (late) out.push(`A friendly reminder from the Tattler: ${late === 1 ? 'a certain resident’s bill is' : late + ' bills are'} now overdue. We won’t name names. You know who you are.`);
  const tickets = S.bills.filter(b => b.kind === 'fine' && b.issuedDay === D);
  if (tickets.length) out.push(`Police blotter: ${tickets.length === 1 ? 'a ticket for “' + esc(tickets[0].items[0]?.name || 'something') + '” was' : tickets.length + ' tickets were'} written today. The suspect is said to be “very sorry.”`);
  const ps = playerList();
  const nFluff = Math.max(1, 3 - out.length);
  const pool = FLUFF.slice().sort((a, b) => noise('fl|' + D + a) - noise('fl|' + D + b));
  for (let i = 0; i < nFluff && ps.length; i++) { const who = ps[Math.floor((noise('fp|' + D + i) + 1) / 2 * ps.length) % ps.length]; out.push(esc(pool[i].replace('{p}', '\u0001')).replace('\u0001', `<b>${esc(who.name)}</b>`)); }
  const pick = out.slice(0, 7);
  return pick;
}

          <h3>Bank board</h3>

      </div>
      <section style="display:grid;gap:8px"><h3 style="font-family:Georgia,serif;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--ink);padding-bottom:4px;font-size:1.05rem">The Town Tattler</h3>
        <p class="muted" style="font-size:.85rem;font-style:italic">Gossip, sightings and things our reporters definitely did not make up.</p>
        ${tattler(D).map(t => `<p class="story">• ${t}</p>`).join('') || '<p class="story muted">It was too quiet for gossip today.</p>'}</section>
    </article>
    ${isToday ? `<section class="panel" style="max-width:680px"><h3>Write for the Gazette</h3><p class="muted" style="font-size:.88rem">Report on something that happened in town, review a restaurant, or write an ad. It goes in today’s paper for everyone to read.</p>

        <div><button class="btn">Publish</button></div></form></section>` : ''}`;
}

function inspectorView() {
  const shops = Object.values(S.shops).filter(sh => sh.ownerId !== 'bank');
  const urgency = sh => (sh.renewalRequested ? 0 : 10) + (licExpired(sh) ? 1 : 0) + (inspOverdue(sh) ? 0 : sh.inspection?.nextDue === today() ? 2 : 5);
  const list = shops.sort((a, c) => urgency(a) - urgency(c) || (a.inspection?.nextDue ?? 999) - (c.inspection?.nextDue ?? 999));
  const expired = shops.filter(licExpired).length, overdue = shops.filter(inspOverdue).length, dueToday = shops.filter(sh => sh.inspection?.nextDue === today()).length, renew = shops.filter(sh => sh.renewalRequested).length;
  const card = sh => {
    const t = bizType(sh), T = BIZ[t], g = sh.inspection?.grade, open = S.inspecting === sh.id;
    return `<section class="shop"><div class="awning" style="background:repeating-linear-gradient(90deg,${T.awning} 0 18px,var(--card) 18px 36px)"></div>
      <div class="panel-head"><div><b>${esc(sh.name)}</b><br><small class="muted">${T.Noun} · ${esc(nameOf(sh.ownerId))}</small></div>
        <div class="row" style="gap:6px">${g ? `<span class="pill ${GRADE_CLS[g]}">Grade ${g}</span>` : '<span class="pill mute">No grade</span>'}${isOpenBiz(sh) ? '<span class="pill good">Open</span>' : '<span class="pill bad">Closed</span>'}</div></div>
      <div class="list">
        <div class="li"><span class="badge">LIC</span><div class="main"><b>${!sh.license ? 'License set up on the next day' : licExpired(sh) ? 'License expired' : 'Licensed through Day ' + sh.license.expiresDay}</b><small>${bizRule(t, 'license')}-day licenses · renewal ${money(renewFee(t))}</small></div>${licExpired(sh) ? '<span class="pill bad">Expired</span>' : ''}</div>
        <div class="li"><span class="badge">INS</span><div class="main"><b>${sh.inspection?.nextDue != null ? (inspOverdue(sh) ? 'Overdue since Day ' + sh.inspection.nextDue : 'Due ' + dayIn(sh.inspection.nextDue)) : 'Schedule starts next day'}</b><small>Every ${bizRule(t, 'inspect')} days${sh.inspection?.day ? ' · last Day ' + sh.inspection.day + (sh.inspection.kindName ? ' (' + esc(sh.inspection.kindName) + (sh.inspection.surprise ? ', surprise' : '') + ')' : '') : ''}${sh.inspection?.notes ? ' · ' + esc(sh.inspection.notes) : ''}</small></div>${inspOverdue(sh) ? '<span class="pill bad">Overdue</span>' : sh.inspection?.nextDue === today() ? '<span class="pill warn">Today</span>' : ''}</div></div>
      ${sh.renewalRequested ? `<div class="alert"><span><b>${esc(nameOf(sh.ownerId))} asked to renew the license</b> on Day ${sh.renewalRequested} · fee ${money(renewFee(t))} from their checking</span><span class="row"><button class="btn sm" data-act="approveRenew" data-id="${sh.id}">Approve</button><button class="btn ghost sm" data-act="denyRenew" data-id="${sh.id}">Deny</button></span></div>` : ''}
      <div class="row">${open ? `<button class="btn ghost sm" data-act="inspectOpen" data-id="${sh.id}">Cancel</button>` : `<button class="btn gold sm" data-act="inspectOpen" data-id="${sh.id}">Inspect now</button><button class="btn danger sm" data-act="inspectSurprise" data-id="${sh.id}">Surprise inspection</button>`}</div>
      ${open ? (() => { const types = inspTypesFor(t), kind = types.includes(S.inspectType[sh.id]) ? S.inspectType[sh.id] : types[0], K = INSPECTIONS[kind]; return `<form data-form="inspect" data-id="${sh.id}" style="border-top:1px solid var(--line);padding-top:12px">
        ${S.inspectSurprise ? '<div class="alert bad"><span><b>Surprise inspection.</b> The owner wasn’t warned. Their regular schedule stays the same unless they fail.</span></div>' : ''}
        <p class="eyebrow">Kind of inspection</p>
        <div class="row" style="gap:6px">${types.map(k => `<button type="button" class="btn ${k === kind ? '' : 'ghost'} sm" data-act="inspectKind" data-id="${sh.id}:${k}">${INSPECTIONS[k].name}</button>`).join('')}</div>
        <p class="eyebrow">${K.name} checklist</p>
        ${K.checks.map((c, i) => `<label style="display:flex;gap:10px;align-items:center;color:var(--ink);font-size:1rem"><input type="checkbox" id="ic-${sh.id}-${kind}-${i}" style="width:auto;min-height:0;transform:scale(1.3)"> ${c}</label>`).join('')}
        <p class="muted" style="font-size:.85rem">5 checks = A, 4 = B, 3 = C, 2 = D, 1 or 0 = F. A D or F shuts the business down and makes the news. It reopens only after earning a C or better on re-inspection in 2 days.</p>
        <div class="fields"><label>Grade<select id="ig-${sh.id}"><option value="auto">Use the checklist</option>${['A', 'B', 'C', 'D', 'F'].map(x => `<option value="${x}">${x}</option>`).join('')}</select></label>
          <label>Notes for the owner<input id="in-${sh.id}" maxlength="120" placeholder="Prices were hard to read"></label></div>
        <div><button class="btn">Save ${S.inspectSurprise ? 'surprise ' : ''}${K.name.toLowerCase()} inspection</button></div></form>`; })() : ''}</section>`;
  };
  return `<div><p class="eyebrow">Business inspector · Day ${today()}</p><h2>Licenses & inspections</h2></div>
    <div class="stats"><div class="stat"><b>${renew}</b><span>Renewals waiting</span></div><div class="stat"><b>${overdue + dueToday}</b><span>Inspections due or overdue</span></div><div class="stat"><b>${expired}</b><span>Expired licenses</span></div><div class="stat"><b>${shops.filter(failedInsp).length}</b><span>Shut down (D or F)</span></div></div>
    <div class="cols"><div class="stack">${list.length ? list.map(card).join('') : '<div class="empty">No businesses yet.</div>'}</div>
    <div class="stack"><section class="panel"><h3>Tax audits</h3><p class="muted" style="font-size:.88rem">A business owner answers ${AUDIT_N} math problems at their grade level, one chance each. Each wrong answer is a ${money(cfg('auditFine'))} fine. Fewer than ${passMark()} right is a failed audit, and a second failed audit costs them their lowest-selling business. There’s a ${Math.round(cfg('auditChance'))}% chance of a surprise audit each new day.</p>
      ${ownersList().length ? `<form class="inline" data-form="startAudit"><label>Audit<select id="au-who"><option value="random">A random business owner</option>${ownersList().filter(p => !auditPending(p.id)).map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><button class="btn danger">Start audit</button></form>` : '<p class="muted">Nobody owns a business yet.</p>'}
      <div class="list">${playerList().filter(p => auditOf(p.id)).map(p => { const a = auditOf(p.id); return `<div class="li"><div class="main"><b>${esc(p.name)}</b><small>Audit from Day ${a.day}${a.status === 'pending' ? ` · ${a.idx} of ${AUDIT_N} answered · due Day ${a.dueDay}` : ` · ${AUDIT_N - (a.wrong || 0)} of ${AUDIT_N} right`}</small></div><span class="pill ${a.status === 'pending' ? 'warn' : a.status === 'passed' ? 'good' : a.status === 'fined' ? 'warn' : 'bad'}">${a.status === 'pending' ? 'In progress' : a.status === 'passed' ? 'Clean' : a.status === 'fined' ? 'Passed, fined ' + money(a.fine) : a.lostShop ? 'Lost ' + esc(a.lostShop) : 'Failed · strike ' + strikesOf(p.id)}</span></div>`; }).join('')}</div></section>
    <section class="panel"><h3>Schedules by business type</h3><div class="tbl-wrap"><table><thead><tr><th>Type</th><th class="r">Inspect every</th><th class="r">License lasts</th><th class="r">Renewal</th></tr></thead><tbody>
      ${Object.keys(BIZ).map(t => `<tr><td>${BIZ[t].Noun}</td><td class="r">${bizRule(t, 'inspect')} days</td><td class="r">${bizRule(t, 'license')} days</td><td class="r num">${money(renewFee(t))}</td></tr>`).join('')}</tbody></table></div>
      <p class="muted" style="font-size:.85rem">Change these in Settings. Owners get a message when an inspection is due and when a license is about to run out.</p></section>
    <section class="panel"><h3>How it works</h3><p class="muted">Walk over to the business and check it in real life. Is the stand tidy? Are the prices posted? Tap the boxes that pass. The grade shows on Main Street and nudges the share price. A D or F shuts a business down and makes the Gazette. It stays closed until it earns a C or better. An expired license also closes it until renewed.</p></section></div></div>`;
}

  let review = S.gigs.filter(g => g.status === 'review'), active = S.gigs.filter(g => g.status === 'open' || g.status === 'claimed').sort((a, c) => c.at - a.at);

  return `<div class="cols"><div class="stack">
    <section class="panel"><h3>Waiting for your OK</h3>${(review = review.filter(g => g.kind !== 'request')).length ? review.map(g => `<div class="shop"><div class="panel-head"><b>${esc(nameOf(g.claimedBy))} finished: ${esc(g.title)}</b><span class="amt">${money(g.pay)}</span></div>
      <form class="inline" data-form="gigReview" data-id="${g.id}"><label>Note if it isn’t done (optional)<input id="gr-${g.id}" maxlength="80" placeholder="Missed a spot by the door"></label><button type="button" class="btn" data-act="approveGig" data-id="${g.id}">Approve & pay</button><button class="btn ghost">Not done yet</button></form></div>`).join('') : '<div class="empty">Nothing to check.</div>'}</section>
    <section class="panel"><h3>Jobs on the board</h3>${active.length ? `<div class="list">${active.map(g => `<div class="li"><span class="badge">${g.kind === 'random' ? 'JOB' : 'REAL'}</span><div class="main"><b>${esc(g.title)}</b><small>${g.status === 'claimed' ? 'Taken by ' + esc(nameOf(g.claimedBy)) : 'Open'}${g.kind === 'random' ? ' · ' + TIER[tierFor(g.pay)][0] : ''}${g.kind === 'random' ? ' · gone after Day ' + g.expiresDay : ''}</small></div><span class="amt">${money(g.pay)}</span><button class="btn danger sm" data-act="removeGig" data-id="${g.id}">Remove</button></div>`).join('')}</div>` : '<div class="empty">The board is empty.</div>'}
      <div><button class="btn ghost sm" data-act="runNow" data-id="gigs">Post random town jobs now</button></div></section>
  </div><div class="stack">
    <section class="panel"><h3>Post a real job</h3><p class="muted" style="font-size:.88rem">Real chores or tasks. The kid taps “I finished” and you approve before they get paid.</p>

    <section class="panel"><h3>Recently paid</h3>${paid.length ? `<div class="list">${paid.map(g => `<div class="li"><div class="main"><b>${esc(g.title)}</b><small>${esc(nameOf(g.claimedBy))} · Day ${g.paidDay || '?'}</small></div><span class="amt">${money(g.pay)}</span></div>`).join('')}</div>` : '<div class="empty">No jobs paid yet.</div>'}</section>
  </div></div>`;
}

function manageBiz(shop) {
  const t = bizType(shop), T = BIZ[t];
  const items = Object.values(S.items).filter(i => i.shopId === shop.id);
  const orders = S.orders.filter(o => o.shopId === shop.id).sort((a, c) => c.at - a.at);
  const kept = orders.filter(o => o.status !== 'refunded');
  const sales = kept.reduce((s, o) => s + o.total, 0), tips = kept.reduce((s, o) => s + (o.tip || 0), 0);
  const sid = shop.id, pct = salePct(shop);
  return `<div class="panel-head"><div><p class="eyebrow">${shop.ownerId === 'bank' ? 'Run by the town bank' : 'Your ' + T.noun}</p><h2>${esc(shop.name)}</h2></div><button class="btn danger sm" data-act="closeShop" data-id="${sid}">Close ${T.noun}</button></div>
    ${lowStock(shop).length ? `<div class="alert bad"><span><b>Running low:</b> ${lowStock(shop).map(i => `${esc(i.name)} (${i.stock === 0 ? 'sold out' : i.stock + ' left'})`).join(', ')}. Restock below.</span></div>` : ''}
    <div class="stats"><div class="stat"><b>${money(sales)}</b><span>Total sales</span></div>${t === 'farm' ? `<div class="stat"><b>${money(S.tx.filter(x => x.kind === 'supply' && x.supplierShopId === sid).reduce((a, x) => a + x.amount, 0))}</b><span>Ingredients sold to restaurants</span></div>` : ''}${T.cogs ? `<div class="stat"><b>${money(supplySpend(sid))}</b><span>Cost of goods</span></div><div class="stat"><b class="${sales - supplySpend(sid) >= 0 ? 'pos' : 'neg'}">${money(sales - supplySpend(sid), true)}</b><span>Profit so far</span></div>` : ''}${T.tips ? `<div class="stat"><b>${money(tips)}</b><span>Tips earned</span></div>` : ''}<div class="stat"><b>${money(sharePrice(sid))}</b><span>Share price · ${sharesOut(sid)} of ${SHARES} owned by investors</span></div><div class="stat"><b>${orders.filter(o => o.status === 'new').length}</b><span>Orders waiting</span></div></div>
    ${(() => { const n = inspNotice(shop); return n ? `<div class="alert ${n.cls === 'bad' ? 'bad' : n.cls === 'note' ? 'news' : ''}"><span><b>${n.short === 'Today' || n.short === 'Overdue' ? '' : 'Inspection · '}${esc(n.text)}</b></span></div>` : ''; })()}
    ${isOpenBiz(shop) ? '' : `<div class="alert bad"><span><b>${closedWhy(shop)}.</b> Customers can’t buy anything until ${failedInsp(shop) ? 'it earns a C or better on re-inspection' + (shop.inspection?.nextDue ? ' (Day ' + shop.inspection.nextDue + ')' : '') : 'the license is renewed'}.</span></div>`}
    <div class="cols even"><div class="stack">
      ${shop.ownerId === 'bank' ? '' : `<section class="panel"><div class="panel-head"><h3>License & inspection</h3>${shop.inspection?.grade ? `<span class="pill ${GRADE_CLS[shop.inspection.grade]}">Grade ${shop.inspection.grade}</span>` : '<span class="pill mute">Not inspected yet</span>'}</div>
        <div class="list">
          <div class="li"><span class="badge">LIC</span><div class="main"><b>${!shop.license ? 'License starts tomorrow' : licExpired(shop) ? 'License expired' : 'Licensed through Day ' + shop.license.expiresDay}</b><small>Licenses last ${bizRule(t, 'license')} days · renewing costs ${money(renewFee(t))}</small></div>
            ${shop.renewalRequested ? '<span class="pill warn">Renewal waiting</span>' : `<button class="btn ${licExpired(shop) ? 'gold' : 'ghost'} sm" data-act="askRenew" data-id="${sid}">Renew</button>`}</div>
          <div class="li"><span class="badge">INS</span><div class="main"><b>${shop.inspection?.nextDue != null ? (inspOverdue(shop) ? 'Inspection overdue since Day ' + shop.inspection.nextDue : 'Next inspection ' + dayIn(shop.inspection.nextDue)) : 'First inspection is scheduled tomorrow'}</b><small>Inspected every ${bizRule(t, 'inspect')} days${shop.inspection?.day ? ' · last on Day ' + shop.inspection.day : ''}</small></div></div></div>
        ${shop.inspection?.notes ? `<p class="muted" style="font-size:.88rem">Inspector’s notes: ${esc(shop.inspection.notes)}</p>` : ''}
        ${shop.inspection?.kindName ? `<p style="font-size:.9rem">Last inspection: <b>${esc(shop.inspection.kindName)}</b>${shop.inspection.surprise ? ' (surprise)' : ''} on Day ${shop.inspection.day} · Grade ${shop.inspection.grade}${shop.inspection.missed?.length ? ' · needs work: ' + esc(shop.inspection.missed.join(', ').toLowerCase()) : ' · perfect score'}</p>` : ''}
        <p class="muted" style="font-size:.85rem">Inspections you could get: ${inspTypesFor(t).map(k => INSPECTIONS[k].name.toLowerCase()).join(', ')}. The inspector can also show up by surprise at any time. Better grades raise your share price. A D or F shuts you down and puts you in the newspaper.</p></section>`}
      ${T.cogs ? `<section class="panel"><h3>Costs</h3><p class="muted" style="font-size:.9rem">Every sale automatically pays ${cfg('wholesalePct')}% of the item’s regular price for ${t === 'restaurant' ? 'ingredients' : 'goods'}${t === 'restaurant' ? `, bought from a local farm stand at ${cfg('farmDiscount')}% off when one is open` : ''}. The rest is your profit. Sales discounts come out of your profit, so price carefully!</p></section>` : ''}
      <section class="panel"><div class="panel-head"><h3>Sales & promotions</h3>${pct ? `<span class="pill bad">${pct}% off · ${saleWhen(shop)}</span>` : ''}</div>
        ${pct ? `<p class="muted">Everything is ${pct}% off on Main Street ${saleWhen(shop)}.</p><div><button class="btn ghost sm" data-act="endSale" data-id="${sid}">End the sale</button></div>`
        : `<p class="muted">Run a sale to bring in customers. Everything on your ${T.list.toLowerCase()} gets cheaper and Main Street shows it off.</p>
        <form class="inline" data-form="startSale" data-id="${sid}"><label>Discount<select id="sl-p-${sid}"><option value="10">10% off</option><option value="20" selected>20% off</option><option value="25">25% off</option><option value="50">Half off</option></select></label>
          <label>How long<select id="sl-d-${sid}"><option value="1">Today only</option><option value="2">2 days</option><option value="3">3 days</option></select></label><button class="btn gold">Start sale</button></form>`}</section>
      <section class="panel"><h3>Orders</h3><div class="list">${orders.length ? orders.map(o => `<div class="li"><div class="main"><b>${o.qty} × ${esc(o.itemName)}</b><small>${esc(nameOf(o.buyerId))} · ${o.day ? 'Day ' + o.day : when(o.at)} · ${money(o.total)}${o.stayDay ? ' · night of Day ' + o.stayDay : ''}${o.salePct ? ' · ' + o.salePct + '% off' : ''}${o.tip ? ' incl. ' + money(o.tip) + ' tip' : ''}</small></div>
        ${o.status === 'new' ? `<button class="btn sm" data-act="deliver" data-id="${o.id}">${T.done}</button><button class="btn ghost sm" data-act="refund" data-id="${o.id}">Refund</button>` : `<span class="pill ${o.status === 'done' ? 'good' : 'mute'}">${o.status === 'done' ? T.done : 'Refunded'}</span>`}</div>`).join('') : '<div class="empty">No orders yet.</div>'}</div></section>
    </div><div class="stack">
      ${T.hotel ? `<section class="panel"><h3>Occupancy, next 7 nights</h3>${items.length ? `<div class="tbl-wrap"><table><thead><tr><th>Night</th><th class="r">Town guests</th><th class="r">Tourists</th><th class="r">Free</th><th class="r">Tourist income</th></tr></thead><tbody>${[0, 1, 2, 3, 4, 5, 6].map(k => { const d = today() + k; let b = 0, tt = 0, f = 0, inc = 0; items.forEach(i => { const bb = roomsBooked(i.id, d), x = tourists(shop, i, d); b += bb; tt += x; f += Math.max(0, (i.stock || 0) - bb - x); inc += x * priceNow(i, shop); }); return `<tr><td>${k === 0 ? 'Tonight' : dayIn(d)}</td><td class="r">${b}</td><td class="r">${tt}</td><td class="r">${f}</td><td class="r num">${money(inc)}</td></tr>`; }).join('')}</tbody></table></div>
        <p class="muted" style="font-size:.85rem">Tourists check in each night and pay you when you reach that day. Future nights are estimates. Better inspection grades bring more tourists; a closed hotel gets none.</p>` : '<div class="empty">Add a room type and how many rooms it has.</div>'}</section>` : ''}
      <section class="panel"><h3>Add to the ${T.list.toLowerCase()}</h3><form data-form="addItem" data-id="${sid}"><div class="fields">
        <label>${T.item}<input id="ai-n-${sid}" required maxlength="40" placeholder="${T.iph}"></label>
        <label>Price${T.hotel ? ' per night' : ''}<input id="ai-p-${sid}" inputmode="decimal" required placeholder="${T.hotel ? '8.00' : '2.00'}"></label>
        <label>${T.restock ? 'Starting stock to buy' : T.stockLbl}<input id="ai-s-${sid}" type="number" min="${T.hotel ? 1 : 0}" placeholder="${T.hotel ? 'How many rooms' : T.restock ? 'How many' : 'Blank = unlimited'}" ${T.hotel || T.restock ? 'required' : ''}></label></div>
        ${T.restock ? `<p class="muted" style="font-size:.85rem">Stock costs ${cfg('wholesalePct')}% of your selling price from the town wholesaler (at least ${money(25)} each). It comes out of your checking.</p>` : ''}
        <div><button class="btn">Add</button></div></form></section>
      <section class="panel"><h3>${T.list}</h3><div class="list">${items.length ? items.map(i => `<div style="border-top:1px solid var(--line);padding:10px 0;display:grid;gap:8px"><form class="inline" data-form="editItem" data-id="${i.id}" style="flex-wrap:nowrap;align-items:center">

    </div></div>`;
}

      <div class="stat"><b>${money(owed)}</b><span>Owed on loans & mortgages</span></div><div class="stat"><b>${money(unpaid.reduce((s, x) => s + x.total, 0))}</b><span>Unpaid bills (${unpaid.length})</span></div></div>

        <div class="row" style="gap:6px">${[['', 'Everyone'], ...ps.map(p => [p.id, p.name])].map(([id, n]) => `<button class="btn ${(S.ledgerWho || '') === id ? '' : 'ghost'} sm" data-act="ledgerWho" data-id="${id}">${esc(n)}</button>`).join('')}</div>

      <section class="panel"><h3>Town news</h3><div class="list">${news.length ? news.map(n => `<div class="li"><span class="badge">D${n.day}</span><div class="main"><b>${esc(n.title)}</b><small>${esc(n.text)}</small></div></div>`).join('') : '<div class="empty">No town events yet.</div>'}</div></section>

entChance'))}% chance of a town event`].filter(Boolean);

    return `<div class="cols"><div class="stack">

  if (S.tab === 'teller') {
