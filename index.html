<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Town Bank">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Pretend Town Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@500&family=Caveat:wght@600&display=swap">
<style>
/* Layout: a town bank on an iPad. Sticky header + tab rail, then a two-column working area that stacks on phones. Account cards borrow banknote engraving. */
:root{
  --paper:#EDF2EE; --card:#FAFCFA; --ink:#12302A; --muted:#566B63; --line:#C9D7CF;
  --note:#1B6A50; --note-ink:#FFFFFF; --coin:#D4951A; --good:#1C7A4C; --bad:#B4412C; --warn:#A87414;
  --shade:rgba(18,48,42,.08);
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-num:"DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --f-sig:"Caveat", "Bradley Hand", cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1613; --card:#14211D; --ink:#E2EDE8; --muted:#94A9A0; --line:#2A3D36;
  --note:#47AE86; --note-ink:#06140F; --coin:#E6AE48; --good:#5CC48E; --bad:#E7735C; --warn:#DDAA4E;
  --shade:rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0D1613; --card:#14211D; --ink:#E2EDE8; --muted:#94A9A0; --line:#2A3D36;
  --note:#47AE86; --note-ink:#06140F; --coin:#E6AE48; --good:#5CC48E; --bad:#E7735C; --warn:#DDAA4E;
  --shade:rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.pos{color:var(--good)} .neg{color:var(--bad)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1160px;margin:0 auto}
.seal{width:38px;height:38px;border-radius:50%;background:var(--note);color:var(--note-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.1rem;flex:none;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--note)}
.brand{min-width:0;flex:1}
.brand b{display:block;font-family:var(--f-display);font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:.8rem;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1160px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:var(--muted);font:600 .95rem var(--f-body);padding:10px 14px;border-radius:999px;cursor:pointer;min-height:44px}
.tab[aria-current="page"]{background:var(--note);color:var(--note-ink)}
.tab .dot{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--coin);color:#1b1205;font-size:.75rem;line-height:20px;text-align:center}

main{max-width:1160px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
.cols{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:820px){.cols{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)} .cols.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.stack{display:grid;gap:20px;align-content:start;min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}

.accts{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.acct{position:relative;overflow:hidden;border-radius:16px;padding:18px;color:var(--note-ink);background:var(--note);min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;box-shadow:0 8px 24px var(--shade)}
.acct.sav{background:var(--coin);color:#1b1205}
.acct::before{content:"";position:absolute;inset:0;opacity:.18;pointer-events:none;
  background:repeating-radial-gradient(circle at 100% 0%,transparent 0 9px,currentColor 9px 10px),repeating-radial-gradient(circle at 0% 120%,transparent 0 13px,currentColor 13px 14px)}
.acct>*{position:relative}
.acct .k{font-size:.75rem;text-transform:uppercase;letter-spacing:.14em;font-weight:700;opacity:.85;display:flex;justify-content:space-between;gap:8px}
.acct .v{font-family:var(--f-num);font-size:clamp(1.8rem,5vw,2.4rem);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.acct .s{font-size:.85rem;opacity:.9}

.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card)}
.stat b{display:block;font-family:var(--f-num);font-size:1.4rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}

.list{display:grid}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .main{flex:1;min-width:0}
.li .main b{display:block;font-weight:600;overflow-wrap:anywhere}
.li .main small{color:var(--muted);font-size:.82rem}
.li .amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.badge{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;font-weight:700;font-size:.8rem;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.good{color:var(--good)} .pill.bad{color:var(--bad)} .pill.warn{color:var(--warn)} .pill.note{color:var(--note)} .pill.mute{color:var(--muted)}

form{display:grid;gap:12px;margin:0}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
label{display:grid;gap:5px;font-size:.85rem;font-weight:600;color:var(--muted)}
input,select,textarea{font:500 1rem var(--f-body);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
.btn{font:700 1rem var(--f-body);border:0;border-radius:12px;padding:12px 18px;min-height:46px;cursor:pointer;background:var(--note);color:var(--note-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--coin);color:#1b1205}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:.88rem;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inline{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.inline>label{flex:1 1 120px}

/* the check */
.check{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px;gap:16px;position:relative;
  background-image:repeating-linear-gradient(135deg,transparent 0 7px,var(--shade) 7px 8px);box-shadow:0 6px 20px var(--shade)}
.check-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.check-top b{font-family:var(--f-display);color:var(--ink);font-size:1.05rem}
.check label{color:var(--ink)}
.check input,.check select{background:transparent;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:8px 2px}
.sigline{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.sig{font-family:var(--f-sig);font-size:2rem;color:var(--note);border-bottom:1px solid var(--muted);min-width:180px;padding:0 8px;line-height:1.1}
.micr{font-family:var(--f-num);font-size:.8rem;color:var(--muted);letter-spacing:.1em}

.gauge-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.gauge{width:150px;height:auto;flex:none}
.score{font-family:var(--f-num);font-size:2.4rem;line-height:1}

.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
td.num{white-space:nowrap}

.pick{max-width:860px;margin:0 auto;display:grid;gap:22px;padding-block:24px}
.people{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.person{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:18px 14px;display:grid;justify-items:center;gap:10px;cursor:pointer;font:600 1.05rem var(--f-body);color:var(--ink);min-height:150px}
.person .av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:800 1.6rem var(--f-display);color:#fff}
.person small{color:var(--muted);font-weight:500;font-size:.82rem}
.person.bank{border-style:dashed}
.person.bank .av{background:var(--ink);color:var(--paper)}

.empty{border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted);text-align:center}
.shop{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;background:var(--paper)}
.awning{height:10px;border-radius:6px;background:repeating-linear-gradient(90deg,var(--note) 0 18px,var(--card) 18px 36px)}

.overlay{position:fixed;inset:0;background:rgba(5,15,12,.55);display:grid;place-items:center;z-index:20;padding:20px}
.dialog{background:var(--card);border-radius:18px;padding:22px;max-width:420px;width:100%;display:grid;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{min-height:60px;font:600 1.4rem var(--f-num);border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.dots{display:flex;gap:14px;justify-content:center}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--note)}
.dots i.on{background:var(--note)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-weight:600;z-index:30;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.err{background:var(--bad);color:#fff}
.center{min-height:60vh;display:grid;place-items:center;text-align:center;padding:20px}
@media (prefers-reduced-motion:no-preference){.acct,.panel{animation:rise .3s ease-out both}@keyframes rise{from{transform:translateY(6px)}to{transform:none}}}
.daychip{font-family:var(--f-num);font-size:.8rem;padding:2px 8px;border-radius:999px;background:var(--coin);color:#1b1205;margin-right:6px;white-space:nowrap}
.alert{border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--card));border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.alert.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.cal{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.bigday{font-family:var(--f-display);font-weight:800;font-size:3.4rem;line-height:1}
select.tipsel{width:auto;min-height:40px;padding:6px 8px}
.alert.news{border-color:var(--note);background:color-mix(in srgb,var(--note) 10%,var(--card))}
.alert.sale{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--card))}
s.muted{font-size:.85em}
.msgs{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:820px){.msgs{grid-template-columns:minmax(0,320px) minmax(0,1fr)} .show-narrow{display:none!important}}
@media (max-width:819px){.hide-narrow{display:none!important}}
.convo{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;font:inherit;color:inherit;cursor:pointer;padding:11px 8px;border-radius:0}
.convo.on{background:var(--paper);border-radius:10px}
.convo .dot{min-width:22px;padding:0 6px;border-radius:999px;background:var(--coin);color:#1b1205;font-size:.75rem;line-height:22px;text-align:center;font-weight:700}
.thread{display:flex;flex-direction:column;gap:8px;max-height:55vh;min-height:200px;overflow-y:auto;padding:4px}
.bub{max-width:80%;align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px;display:grid;gap:2px;overflow-wrap:anywhere}
.bub.mine{align-self:flex-end;background:var(--note);color:var(--note-ink);border-color:transparent;border-radius:14px 14px 4px 14px}
.bub small{font-size:.72rem;opacity:.75}
.compose{display:flex;gap:8px;grid-template-columns:none}
.compose input{flex:1}
</style>

<script>
// ===== PASTE YOUR FIREBASE SETTINGS BETWEEN THE BRACES BELOW =====
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBP_IfTFX5AwGqnAF8kVO27s6EQxAeBc3A",
  authDomain: "pretend-town.firebaseapp.com",
  projectId: "pretend-town",
  storageBucket: "pretend-town.firebasestorage.app",

<script>
(() => {
const app = document.getElementById('app');
let db = null;
const S = {
  dbState: 'loading', settings: undefined, settingsConfirmed: false,
  players: {}, tx: [], shops: {}, items: {}, orders: [], loans: {}, bills: [], holdings: [], teller: [], cds: [], messages: [], thread: null,
  me: null, tab: null, modal: null, pin: null, toast: null, busy: false, err: null, slow: false,
};
const COLORS = ['#2F7D6B','#C0612B','#5B5BB5','#B0457A','#3C7FB0','#8A6D1F','#6C8A2E','#9C4BB3'];
const DEFAULTS = {day: 1, payEvery: 3, billEvery: 4, billGrace: 2, interestEvery: 7, lateFee: 200, taxRate: 10, savingsRate: 2, loanRate: 5,
  rentEvery: 7, mortgageRate: 2, mortgageTerm: 10, downPct: 20, cdRate: 8, cdDays: 7, cdPenalty: 10, eventChance: 35};
const DEFAULT_UTIL = [{name: 'Electric', amount: 800}, {name: 'Water', amount: 500}, {name: 'Internet', amount: 600}];
const DEFAULT_HOMES = [{name: 'Apartment', rent: 1000, price: 15000}, {name: 'Townhouse', rent: 1600, price: 25000}, {name: 'House with a yard', rent: 2400, price: 40000}];
const SHARES = 20;
const BIZ = {
  shop: {noun: 'shop', Noun: 'Shop', list: 'Price list', item: 'Item', buy: 'Buy', done: 'Delivered', waiting: 'Waiting for delivery', ph: 'Lemonade Stand', php: 'Fresh lemonade and cookies', iph: 'Cookie'},
  restaurant: {noun: 'restaurant', Noun: 'Restaurant', list: 'Menu', item: 'Dish', buy: 'Order', done: 'Served', waiting: 'Waiting to be served', ph: 'The Hungry Moose Diner', php: 'Pancakes, burgers and milkshakes', iph: 'Cheeseburger'},
};
const EVENTS = [
  {t: 'Town Fair', x: 'Everyone wins a {a} prize at the fair.', e: 'bonusAll', a: 500},
  {t: 'Tax refund', x: 'The town had money left over. Everyone gets {a} back.', e: 'bonusAll', a: 300},
  {t: 'Snowstorm', x: 'Heating costs went up. Everyone gets a {a} storm bill.', e: 'billAll', a: 400},
  {t: 'Road repairs', x: 'The potholes got fixed. Everyone pays a {a} road fee.', e: 'billAll', a: 200},
  {t: 'Stock market boom', x: 'Investors are excited. Share prices are up 25% today.', e: 'market', a: 25},
  {t: 'Market dip', x: 'Investors got nervous. Share prices are down 20% today.', e: 'market', a: -20},
  {t: 'Found money', x: '{p} found {a} on the sidewalk!', e: 'bonusOne', a: 1000},
  {t: 'Lucky raffle', x: '{p} won the town raffle: {a}!', e: 'bonusOne', a: 1500},
  {t: 'Lost wallet', x: 'Oh no! {p} lost a wallet with {a} inside.', e: 'takeOne', a: 500},
  {t: 'Burst pipe', x: 'A pipe burst at {p}’s place. The repair bill is {a}.', e: 'billOne', a: 800},
  {t: 'Bank birthday', x: 'The bank is celebrating. Savings earn double on the next interest day.', e: 'savings', a: 2},
  {t: 'Holiday bonus', x: 'Everyone’s next paycheck gets a 20% holiday bonus.', e: 'payBonus', a: 20},
];
const bizType = s => (s && s.type === 'restaurant') ? 'restaurant' : 'shop';

// ---------- utils ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } };
const hash = s => { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
const sym = () => S.settings?.symbol || '$';
const money = (c, signed) => { const v = Math.abs(c || 0) / 100; const s = sym() + v.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}); return (c < 0 ? '−' : (signed && c > 0 ? '+' : '')) + s; };
const toCents = v => { const n = parseFloat(String(v).replace(/[^0-9.]/g, '')); return isFinite(n) ? Math.round(n * 100) : NaN; };
const when = t => { const d = new Date(t); return d.toLocaleDateString(undefined, {month: 'short', day: 'numeric'}) + ', ' + d.toLocaleTimeString(undefined, {hour: 'numeric', minute: '2-digit'}); };
const acctNo = id => String(1000 + hash(id) % 9000);
const color = id => COLORS[hash(id) % COLORS.length];
const initial = n => esc((n || '?').trim().charAt(0).toUpperCase());
const fail = msg => { const e = new Error(msg); e.userMsg = msg; throw e; };
const val = id => document.getElementById(id)?.value ?? '';
const cfg = k => { const v = S.settings?.[k]; return (v == null || v === '' || !isFinite(Number(v))) ? DEFAULTS[k] : Number(v); };
const every = k => Math.max(1, Math.round(cfg(k)));
const today = () => Math.max(1, Math.round(cfg('day')));
const nextOn = k => { const n = every(k); return n * (Math.floor(today() / n) + 1); };
const utilities = () => Array.isArray(S.settings?.utilities) ? S.settings.utilities.filter(u => u && u.name && u.amount > 0) : DEFAULT_UTIL;
const homes = () => Array.isArray(S.settings?.homes) ? S.settings.homes.filter(h => h && h.name) : DEFAULT_HOMES;
const billTotal = () => utilities().reduce((s, u) => s + u.amount, 0);
const dayIn = d => d === today() ? 'today' : d === today() + 1 ? 'tomorrow' : 'Day ' + d;
const pickRandom = a => a[Math.floor(Math.random() * a.length)];
function mortgagePayment(P, ratePct, n) { const r = ratePct / 100; n = Math.max(1, n); return Math.ceil(r > 0 ? P * r / (1 - Math.pow(1 + r, -n)) : P / n); }

function nameOf(pid) { return pid === 'bank' ? 'Town Bank' : (S.players[pid]?.name || 'Former resident'); }
function balances() {
  const b = {};
  for (const t of S.tx) {
    if (t.from !== 'bank') b[t.from] = (b[t.from] || 0) - t.amount;

const bal = (b, pid, a) => b[pid + '.' + a] || 0;
const playerList = () => Object.values(S.players).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

const contacts = () => ['board', ...(S.me === 'bank' ? [] : ['bank']), ...playerList().map(p => p.id).filter(id => id !== S.me)];
function threadMsgs(key) {

const unreadTotal = () => { const r = readMap(); return contacts().reduce((s, k) => s + unreadIn(k, r), 0); };
function messagesView() {

// sales & stocks
const salePct = shop => (shop && shop.sale && shop.sale.pct > 0 && today() <= shop.sale.untilDay) ? shop.sale.pct : 0;
const priceNow = (item, shop) => Math.round(item.price * (100 - salePct(shop)) / 100);
const saleWhen = shop => shop.sale.untilDay === today() ? 'today only' : 'through Day ' + shop.sale.untilDay;
function revenue(shopId, endDay) {
  return S.orders.filter(o => o.shopId === shopId && o.status !== 'refunded' && (o.day || 1) > endDay - 7 && (o.day || 1) <= endDay).reduce((s, o) => s + o.total, 0);
}
function sharePrice(shopId, day = today()) {
  let p = Math.round((10000 + 4 * revenue(shopId, day)) / SHARES);
  const ev = S.settings?.event;
  if (ev && ev.effect === 'market' && day >= ev.day && day <= (ev.untilDay ?? ev.day)) p = Math.round(p * (100 + ev.value) / 100);
  return Math.max(100, p);
}
const sharesOut = shopId => S.holdings.filter(h => h.shopId === shopId).reduce((s, h) => s + (h.shares || 0), 0);
const holdingsOf = pid => S.holdings.filter(h => h.playerId === pid && h.shares > 0);
function spark(shopId) {
  const days = []; for (let d = Math.max(1, today() - 7); d <= today(); d++) days.push(sharePrice(shopId, d));
  if (days.length < 2) days.unshift(days[0]);
  const min = Math.min(...days), max = Math.max(...days), span = max - min || 1;
  const pts = days.map((v, i) => `${(i / (days.length - 1) * 76 + 2).toFixed(1)},${(22 - (v - min) / span * 18).toFixed(1)}`).join(' ');
  const up = days[days.length - 1] >= days[0];
  return `<svg viewBox="0 0 80 26" width="80" height="26" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--${up ? 'good' : 'bad'})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function netWorth(pid, b) {
  const p = S.players[pid] || {};
  let w = bal(b, pid, 'c') + bal(b, pid, 's');
  w += cdsOf(pid).filter(c => c.status === 'open').reduce((s, c) => s + c.amount, 0);
  w += holdingsOf(pid).reduce((s, h) => s + h.shares * sharePrice(h.shopId), 0);
  if (p.home && p.home.mode !== 'rent') w += p.home.price - (p.home.mode === 'mortgage' ? (p.home.balance || 0) : 0);
  w -= loansOf(pid).filter(l => l.status === 'active').reduce((s, l) => s + l.balance, 0);
  return w;
}

function credit(pid) {
  const p = S.players[pid] || {};
  let paid = 0, pays = 0, missed = 0, owed = 0;
  for (const l of loansOf(pid)) {
    if (l.status === 'paid') paid++;
    if (l.status === 'active') owed += l.balance || 0;
    pays += l.payments || 0; missed += l.missed || 0;
  }
  const bs = billsOf(pid);
  const onTime = bs.filter(b => b.status === 'paid').length;
  const late = bs.filter(b => b.status === 'late' || b.status === 'paidLate').length;
  const base = Math.max(5000, (p.wage || 0) * 3);
  let score = 620 + paid * 40 + Math.min(100, pays * 6) + Math.min(60, onTime * 5) - missed * 60 - late * 30 - Math.round(Math.min(1, owed / base) * 80);
  score = Math.max(300, Math.min(850, score));
  const band = score >= 750 ? ['Excellent', 'good'] : score >= 670 ? ['Good', 'note'] : score >= 580 ? ['Fair', 'warn'] : ['Needs work', 'bad'];
  const mult = score >= 750 ? 2 : score >= 670 ? 1.5 : score >= 580 ? 1 : .5;
  const limit = Math.round(base * mult);
  return {score, band, limit, owed, avail: Math.max(0, limit - owed), paid, pays, missed, onTime, late};
}
function gauge(score, cls) {
  const f = (score - 300) / 550, a = Math.PI * (1 - f), r = 48;
  const x = 60 + r * Math.cos(a), y = 60 - r * Math.sin(a);
  return `<svg class="gauge" viewBox="0 0 120 68" aria-hidden="true">
    <path d="M12 60 A48 48 0 0 1 108 60" fill="none" stroke="var(--line)" stroke-width="10" stroke-linecap="round"/>
    ${f > 0.005 ? `<path d="M12 60 A48 48 0 0 1 ${x.toFixed(1)} ${y.toFixed(1)}" fill="none" stroke="var(--${cls})" stroke-width="10" stroke-linecap="round"/>` : ''}
    <text x="12" y="67" font-size="7" fill="var(--muted)" text-anchor="middle">300</text>
    <text x="108" y="67" font-size="7" fill="var(--muted)" text-anchor="middle">850</text></svg>`;
}

const KIND = {pay:'Paycheck', check:'Check', move:'Savings transfer', purchase:'Purchase', meal:'Restaurant', refund:'Refund', loan:'Loan', repay:'Loan payment', interest:'Interest', adjust:'From the bank', bill:'Bill', rent:'Rent', home:'Home', stock:'Stocks', cash:'Cash', cd:'CD', event:'Town event'};
function txRows(list, pid, limit = 15) {

async function addTx(from, to, amount, kind, memo, extra = {}) {

}

  await db.collection('bills').add({playerId, kind, label, items, total, issuedDay: day, dueDay: day + Math.max(0, Math.round(cfg('billGrace'))), status: 'due', at: Date.now(), ...extra});
}

  try { await fn(); }

// Scheduled town events. Each returns a short summary or '' and may add to the settings patch.
async function doPayday(patch) {
  const ps = playerList().filter(p => (p.wage || 0) > 0); if (!ps.length) return '';
  const tr = cfg('taxRate'), bonus = Number(S.settings.payBonus || 0);
  for (const p of ps) {
    const gross = Math.round(p.wage * (100 + bonus) / 100), tax = Math.round(gross * tr / 100);
    await addTx('bank', p.id + '.c', gross - tax, 'pay', `Paycheck: ${p.job || 'Wages'} (${money(gross)} gross${bonus ? ' with ' + bonus + '% bonus' : ''}, ${money(tax)} tax)`, {gross, tax});
  }
  patch.lastPayday = Date.now(); patch.paydays = (S.settings.paydays || 0) + 1; if (bonus) patch.payBonus = 0;
  return `${ps.length} paycheck${ps.length > 1 ? 's' : ''}`;
}
async function doInterest(patch) {
  const b = balances(), boost = Number(S.settings.savingsBoost || 1) || 1, sr = cfg('savingsRate') * boost;
  for (const l of Object.values(S.loans).filter(l => l.status === 'active')) {
    const i = Math.round(l.balance * l.rate / 100); if (i > 0) await db.doc('loans/' + l.id).update({balance: l.balance + i, interest: (l.interest || 0) + i});
  }
  for (const p of playerList()) { const i = Math.round(bal(b, p.id, 's') * sr / 100); if (i > 0) await addTx('bank', p.id + '.s', i, 'interest', `Savings interest at ${sr}%`); }
  patch.lastInterest = Date.now(); if (boost !== 1) patch.savingsBoost = 1;

}

  const items = utilities(); if (!items.length) return '';
  const ps = playerList();
  for (const p of ps) await addBill(p.id, 'utility', 'Utilities', items, day);
  return ps.length ? 'utility bills' : '';
}
async function doHousing(day) {
  let n = 0;
  for (const p of playerList()) {
    const h = p.home; if (!h) continue;
    if (h.mode === 'rent') { await addBill(p.id, 'rent', 'Rent', [{name: 'Rent · ' + h.name, amount: h.rent}], day); n++; }
    if (h.mode === 'mortgage' && h.balance > 0) {
      const due = Math.min(h.payment, h.balance + Math.round(h.balance * h.rate / 100));
      await addBill(p.id, 'mortgage', 'Mortgage', [{name: 'Mortgage · ' + h.name, amount: due}], day, {base: due}); n++;
    }
  }
  return n ? 'rent & mortgages' : '';
}

  for (const c of S.cds.filter(c => c.status === 'open' && c.matureDay <= day)) {
    await addTx('bank', c.playerId + '.c', c.payout, 'cd', `CD matured: ${money(c.amount)} + ${money(c.payout - c.amount)} interest`);
    await db.doc('cds/' + c.id).update({status: 'matured'}); n++;

  return n ? `${n} CD${n > 1 ? 's' : ''} matured` : '';
}

  const fee = Math.max(0, Math.round(cfg('lateFee'))); let n = 0;
  for (const b of S.bills.filter(b => b.status === 'due' && b.dueDay < day)) { await db.doc('bills/' + b.id).update({status: 'late', lateFee: fee, total: b.total + fee}); n++; }
  return n ? `${n} late bill${n > 1 ? 's' : ''}` : '';
}
async function drawEvent(day, patch) {
  const ps = playerList(); if (!ps.length) return '';
  const ev = pickRandom(EVENTS), p = pickRandom(ps);
  const text = ev.x.replace('{a}', money(ev.a)).replace('{p}', p.name);
  if (ev.e === 'bonusAll') for (const q of ps) await addTx('bank', q.id + '.c', ev.a, 'event', ev.t);
  if (ev.e === 'billAll') for (const q of ps) await addBill(q.id, 'event', ev.t, [{name: ev.t, amount: ev.a}], day);
  if (ev.e === 'bonusOne') await addTx('bank', p.id + '.c', ev.a, 'event', ev.t);
  if (ev.e === 'takeOne') await addTx(p.id + '.c', 'bank', ev.a, 'event', ev.t);
  if (ev.e === 'billOne') await addBill(p.id, 'event', ev.t, [{name: ev.t, amount: ev.a}], day);
  if (ev.e === 'savings') patch.savingsBoost = ev.a;
  if (ev.e === 'payBonus') patch.payBonus = ev.a;
  patch.event = {title: ev.t, text, day, untilDay: day, effect: ev.e, value: ev.a};
  patch.news = [{day, title: ev.t, text}, ...(S.settings.news || [])].slice(0, 12);

  if (!tabs.some(t => t[0] === S.tab)) S.tab = tabs[0][0];
  const who = isBank ? 'Banker mode' : nameOf(S.me) + (S.players[S.me]?.job ? ' · ' + S.players[S.me].job : '');
  const content = isBank ? bankView() : playerView();

// ---------- player views ----------
function billCard(b, canPay) {
  const late = b.status === 'late', paid = b.status === 'paid' || b.status === 'paidLate';
  const pill = paid ? (b.status === 'paidLate' ? ['Paid late', 'warn'] : ['Paid on time', 'good']) : late ? ['Late', 'bad'] : (b.dueDay === today() ? ['Due today', 'warn'] : ['Due ' + dayIn(b.dueDay), 'note']);
  return `<div class="shop"><div class="panel-head"><b>${esc(b.label || 'Utilities')} · Day ${b.issuedDay}</b><span class="pill ${pill[1]}">${pill[0]}</span></div>
    <div class="list">${b.items.map(u => `<div class="li" style="padding:6px 0"><div class="main">${esc(u.name)}</div><span class="amt">${money(u.amount)}</span></div>`).join('')}
    ${b.lateFee ? `<div class="li" style="padding:6px 0"><div class="main neg">Late fee</div><span class="amt neg">${money(b.lateFee)}</span></div>` : ''}
    <div class="li" style="padding:6px 0"><div class="main"><b>Total</b></div><span class="amt"><b>${money(b.total)}</b></span></div></div>
    ${!paid && canPay ? `<div class="row"><button class="btn ${late ? '' : 'gold'}" data-act="payBill" data-id="${b.id}">Pay ${money(b.total)} from checking</button></div>` : ''}</div>`;
}

  }
  if (S.tab === 'pay') {
    const others = playerList().filter(x => x.id !== pid);

        <label>Amount (${esc(sym())})<input id="ck-amt" inputmode="decimal" placeholder="0.00" required></label>
        <label>Memo<input id="ck-memo" maxlength="60" placeholder="What’s it for?"></label>
        <div class="sigline"><div><span class="muted" style="font-size:.8rem">Signed</span><div class="sig">${esc(p.name)}</div></div><button class="btn">Sign & send</button></div>

    </div><div class="stack"><section class="panel"><h3>Your checks</h3><div class="list">${txRows(checks, pid, 30)}</div></section></div></div>`;
  }
  if (S.tab === 'shop') {
    const bizs = Object.values(S.shops).filter(s => s.ownerId !== pid).sort((a, c) => (salePct(c) - salePct(a)) || bizType(a).localeCompare(bizType(c)));

        ${c.status === 'open' ? `<button class="btn ghost sm" data-act="cdEarly" data-id="${c.id}">Cash out early</button>` : `<span class="pill ${c.status === 'matured' ? 'good' : 'mute'}">${c.status === 'matured' ? 'Matured' : 'Closed'}</span>`}</div>`).join('')}</div>` : '<div class="empty">No CDs yet.</div>'}</section>
      <section class="panel"><h3>Your loans</h3>${loans.length ? loans.map(l => `<div class="shop">

        ${l.status === 'active' ? `<p>Still owe <b class="num">${money(l.balance)}</b> · ${l.rate}% interest every ${every('interestEvery')} days · interest so far <span class="num">${money(l.interest || 0)}</span></p>
          <form class="inline" data-form="repay" data-id="${l.id}"><label>Pay back<input id="rp-${l.id}" inputmode="decimal" placeholder="${(Math.min(l.balance, Math.max(0, bal(b, pid, 'c'))) / 100).toFixed(2)}" required></label><button class="btn gold">Make payment</button></form>`
        : `<small class="muted">${when(l.at)}${l.status === 'paid' ? ` · paid ${money(l.interest || 0)} in interest` : ''}</small>`}</div>`).join('') : '<div class="empty">No loans yet.</div>'}
        <h3 style="margin-top:6px">Ask for a loan</h3><p>You can borrow up to <b class="num">${money(cr.avail)}</b> right now at <b>${cfg('loanRate')}%</b> every ${every('interestEvery')} days.</p>
        <form data-form="request"><div class="fields"><label>Amount<input id="lr-amt" inputmode="decimal" required placeholder="0.00"></label>
          <label>What’s it for?<input id="lr-why" maxlength="50" required placeholder="Supplies for my shop"></label></div>
          <div><button class="btn" ${cr.avail <= 0 ? 'disabled' : ''}>Send to the banker</button></div></form></section>
    </div><div class="stack">
      <section class="panel"><div class="gauge-wrap">${gauge(cr.score, cr.band[1])}<div style="display:grid;gap:4px"><p class="eyebrow">Your credit score</p><div class="score num">${cr.score}</div><span class="pill ${cr.band[1]}">${cr.band[0]}</span></div></div>
        <div class="stats">
          <div class="stat"><b>${cr.paid}</b><span>Loans paid off (+40 each)</span></div>
          <div class="stat"><b>${cr.pays}</b><span>Loan payments (+6 each)</span></div>
          <div class="stat"><b>${cr.onTime}</b><span>Bills paid on time (+5 each)</span></div>
          <div class="stat"><b>${cr.late}</b><span>Late bills (−30 each)</span></div>
          <div class="stat"><b>${cr.missed}</b><span>Missed loan payments (−60 each)</span></div>
          <div class="stat"><b>${money(cr.owed)}</b><span>Owed of ${money(cr.limit)} limit</span></div></div>
        <p class="muted" style="font-size:.88rem">Scores run 300 to 850. You need at least 580 for a mortgage. Paying bills and loans on time raises it. Late bills, missed payments, or borrowing close to your limit lower it.</p></section>
    </div></div>`;
  }
  return '';
}

function manageBiz(shop) {
  const t = bizType(shop), T = BIZ[t];
  const items = Object.values(S.items).filter(i => i.shopId === shop.id);
  const orders = S.orders.filter(o => o.shopId === shop.id).sort((a, c) => c.at - a.at);
  const kept = orders.filter(o => o.status !== 'refunded');
  const sales = kept.reduce((s, o) => s + o.total, 0), tips = kept.reduce((s, o) => s + (o.tip || 0), 0);
  const sid = shop.id, pct = salePct(shop);
  return `<div class="panel-head"><div><p class="eyebrow">Your ${T.noun}</p><h2>${esc(shop.name)}</h2></div><button class="btn danger sm" data-act="closeShop" data-id="${sid}">Close ${T.noun}</button></div>
    <div class="stats"><div class="stat"><b>${money(sales)}</b><span>Total sales</span></div>${t === 'restaurant' ? `<div class="stat"><b>${money(tips)}</b><span>Tips earned</span></div>` : ''}<div class="stat"><b>${money(sharePrice(sid))}</b><span>Share price · ${sharesOut(sid)} of ${SHARES} owned by investors</span></div><div class="stat"><b>${orders.filter(o => o.status === 'new').length}</b><span>Orders to ${t === 'shop' ? 'deliver' : 'serve'}</span></div></div>
    <div class="cols even"><div class="stack">
      <section class="panel"><div class="panel-head"><h3>Sales & promotions</h3>${pct ? `<span class="pill bad">${pct}% off · ${saleWhen(shop)}</span>` : ''}</div>
        ${pct ? `<p class="muted">Everything is ${pct}% off on Main Street ${saleWhen(shop)}.</p><div><button class="btn ghost sm" data-act="endSale" data-id="${sid}">End the sale</button></div>`
        : `<p class="muted">Run a sale to bring in customers. Everything on your ${T.list.toLowerCase()} gets cheaper and Main Street shows it off.</p>
        <form class="inline" data-form="startSale" data-id="${sid}"><label>Discount<select id="sl-p-${sid}"><option value="10">10% off</option><option value="20" selected>20% off</option><option value="25">25% off</option><option value="50">Half off</option></select></label>
          <label>How long<select id="sl-d-${sid}"><option value="1">Today only</option><option value="2">2 days</option><option value="3">3 days</option></select></label><button class="btn gold">Start sale</button></form>`}</section>
      <section class="panel"><h3>Orders</h3><div class="list">${orders.length ? orders.map(o => `<div class="li"><div class="main"><b>${o.qty} × ${esc(o.itemName)}</b><small>${esc(nameOf(o.buyerId))} · ${o.day ? 'Day ' + o.day : when(o.at)} · ${money(o.total)}${o.salePct ? ' · ' + o.salePct + '% off' : ''}${o.tip ? ' incl. ' + money(o.tip) + ' tip' : ''}</small></div>
        ${o.status === 'new' ? `<button class="btn sm" data-act="deliver" data-id="${o.id}">${T.done}</button><button class="btn ghost sm" data-act="refund" data-id="${o.id}">Refund</button>` : `<span class="pill ${o.status === 'done' ? 'good' : 'mute'}">${o.status === 'done' ? T.done : 'Refunded'}</span>`}</div>`).join('') : '<div class="empty">No orders yet.</div>'}</div></section>
    </div><div class="stack">
      <section class="panel"><h3>Add to the ${T.list.toLowerCase()}</h3><form data-form="addItem" data-id="${sid}"><div class="fields">
        <label>${T.item}<input id="ai-n-${sid}" required maxlength="40" placeholder="${T.iph}"></label>
        <label>Price<input id="ai-p-${sid}" inputmode="decimal" required placeholder="${t === 'shop' ? '1.50' : '6.00'}"></label>
        <label>${t === 'shop' ? 'Stock' : 'Servings'}<input id="ai-s-${sid}" type="number" min="0" placeholder="Blank = unlimited"></label></div>
        <div><button class="btn">Add</button></div></form></section>
      <section class="panel"><h3>${T.list}</h3><div class="list">${items.length ? items.map(i => `<form class="li" data-form="editItem" data-id="${i.id}" style="display:flex">
        <div class="main"><b>${esc(i.name)}</b>${pct ? `<small class="neg">On sale: ${money(priceNow(i, shop))}</small>` : ''}</div>
        <input id="ei-p-${i.id}" inputmode="decimal" value="${(i.price / 100).toFixed(2)}" style="width:86px;min-height:40px;padding:6px 8px" aria-label="Price">
        <input id="ei-s-${i.id}" type="number" min="0" value="${i.stock ?? ''}" placeholder="∞" style="width:70px;min-height:40px;padding:6px 8px" aria-label="Stock">
        <button class="btn ghost sm">Save</button><button type="button" class="btn danger sm" data-act="removeItem" data-id="${i.id}" aria-label="Remove">✕</button></form>`).join('') : `<div class="empty">Add your first ${T.item.toLowerCase()}.</div>`}</div></section>
    </div></div>`;
}

// ---------- banker views ----------
function bankView() {
  if (S.tab === 'messages') return messagesView();
  const b = balances(), ps = playerList();
  if (S.tab === 'town') {
    const chk = ps.reduce((s, p) => s + bal(b, p.id, 'c'), 0), sav = ps.reduce((s, p) => s + bal(b, p.id, 's'), 0);
    const owed = Object.values(S.loans).filter(l => l.status === 'active').reduce((s, l) => s + l.balance, 0) + ps.reduce((s, p) => s + (p.home?.mode === 'mortgage' ? p.home.balance : 0), 0);
    const unpaid = S.bills.filter(x => x.status === 'due' || x.status === 'late');
    const q = waitingTeller().length + Object.values(S.loans).filter(l => l.status === 'requested').length;
    const news = S.settings.news || [];
    return `<div class="alert"><span><b>Day ${today()}</b> · next payday ${dayIn(nextOn('payEvery'))} · bills ${dayIn(nextOn('billEvery'))} · rent ${dayIn(nextOn('rentEvery'))} · interest ${dayIn(nextOn('interestEvery'))}</span><button class="btn gold sm" data-act="advance">Advance to Day ${today() + 1}</button></div>

    ${newsBanner()}
    <div class="stats"><div class="stat"><b>${money(chk + sav)}</b><span>Money in accounts</span></div><div class="stat"><b>${money(sav)}</b><span>In savings</span></div>
      <div class="stat"><b>${money(owed)}</b><span>Owed on loans & mortgages</span></div><div class="stat"><b>${money(unpaid.reduce((s, x) => s + x.total, 0))}</b><span>Unpaid bills (${unpaid.length})</span></div></div>
    <div class="cols"><div class="stack">
      <section class="panel"><h3>Residents</h3>${ps.length ? `<div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Home</th><th class="r">Checking</th><th class="r">Savings</th><th class="r">Net worth</th><th class="r">Bills</th><th class="r">Credit</th></tr></thead><tbody>
        ${ps.map(p => { const c = credit(p.id), ob = openBills(p.id); return `<tr><td><b>${esc(p.name)}</b><br><small class="muted">${esc(p.job || 'No job')}</small></td><td>${p.home ? esc(p.home.name) + `<br><small class="muted">${p.home.mode === 'rent' ? 'Renting' : p.home.mode === 'mortgage' ? 'Mortgage' : 'Owns'}</small>` : '<small class="muted">None</small>'}</td><td class="r num ${bal(b, p.id, 'c') < 0 ? 'neg' : ''}">${money(bal(b, p.id, 'c'))}</td><td class="r num">${money(bal(b, p.id, 's'))}</td><td class="r num">${money(netWorth(p.id, b))}</td><td class="r">${ob.length ? `<span class="pill ${ob.some(x => x.status === 'late') ? 'bad' : 'warn'}">${ob.length} open</span>` : '<span class="pill good">Paid</span>'}</td><td class="r"><span class="pill ${c.band[1]}">${c.score}</span></td></tr>`; }).join('')}
        </tbody></table></div>` : `<div class="empty">Add residents under the Residents tab.</div>`}</section>
      <section class="panel"><h3>Town ledger</h3><div class="list">${txRows(S.tx, null, 60)}</div></section>
    </div><div class="stack">
      <section class="panel"><h3>Give or take money</h3><p class="muted" style="font-size:.88rem">Bonuses, birthday money, fines, or fixing a mistake. Taking money can push an account below zero.</p>
        <form data-form="adjust"><div class="fields">
          <label>Resident<select id="ad-who" required><option value="">Choose…</option>${ps.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label>
          <label>Account<select id="ad-acct"><option value="c">Checking</option><option value="s">Savings</option></select></label>
          <label>Give or take<select id="ad-dir"><option value="give">Give</option><option value="take">Take</option></select></label>
          <label>Amount<input id="ad-amt" inputmode="decimal" required placeholder="0.00"></label></div>
          <label>Reason<input id="ad-memo" maxlength="60" placeholder="Great job cleaning your room"></label>
          <div><button class="btn">Record it</button></div></form></section>
      <section class="panel"><h3>Town news</h3><div class="list">${news.length ? news.map(n => `<div class="li"><span class="badge">D${n.day}</span><div class="main"><b>${esc(n.title)}</b><small>${esc(n.text)}</small></div></div>`).join('') : '<div class="empty">No town events yet.</div>'}</div></section>
    </div></div>`;
  }
  if (S.tab === 'calendar') {
    const d = today() + 1, tr = cfg('taxRate'), paid = ps.filter(p => (p.wage || 0) > 0);
    const willPay = d % every('payEvery') === 0, willInt = d % every('interestEvery') === 0, willBill = d % every('billEvery') === 0, willRent = d % every('rentEvery') === 0;
    const willLate = S.bills.filter(x => x.status === 'due' && x.dueDay < d), willCd = S.cds.filter(c => c.status === 'open' && c.matureDay <= d);
    const housed = ps.filter(p => p.home && p.home.mode !== 'own').length;
    const happens = [willPay && `Payday: ${paid.length} paycheck${paid.length === 1 ? '' : 's'}${S.settings.payBonus ? ` with a ${S.settings.payBonus}% bonus` : ''}`, willBill && `Utility bills to ${ps.length} resident${ps.length === 1 ? '' : 's'} (${money(billTotal())} each)`, willRent && housed && `Rent and mortgage bills for ${housed} home${housed > 1 ? 's' : ''}`, willInt && `Interest day for loans and savings${Number(S.settings.savingsBoost || 1) > 1 ? ' (savings doubled)' : ''}`, willCd.length && `${willCd.length} CD${willCd.length > 1 ? 's' : ''} mature and pay out`, willLate.length && `${willLate.length} unpaid bill${willLate.length > 1 ? 's' : ''} turn late (+${money(cfg('lateFee'))} fee each)`, cfg('eventChance') > 0 && `${Math.round(cfg('eventChance'))}% chance of a town event`].filter(Boolean);
    const unpaid = S.bills.filter(x => x.status === 'due' || x.status === 'late').sort((a, c) => a.dueDay - c.dueDay);
    return `<div class="cols"><div class="stack">
      <section class="panel"><div class="panel-head"><div><p class="eyebrow">Today in ${esc(S.settings.name)}</p><div class="bigday">Day ${today()}</div></div>
        <button class="btn gold" data-act="advance">Advance to Day ${d}</button></div>
        <div><p class="eyebrow" style="margin-bottom:6px">When you advance to Day ${d}</p>
        ${happens.length ? `<div class="list">${happens.map(h => `<div class="li"><div class="main"><b>${esc(h)}</b></div></div>`).join('')}</div>` : '<p class="muted">Nothing scheduled. Just a regular day.</p>'}</div></section>
      <section class="panel"><h3>Schedule</h3><div class="cal">
        <div class="stat"><b>${dayIn(nextOn('payEvery'))}</b><span>Payday · every ${every('payEvery')} days</span></div>
        <div class="stat"><b>${dayIn(nextOn('billEvery'))}</b><span>Utilities · every ${every('billEvery')} days, due in ${Math.round(cfg('billGrace'))}</span></div>
        <div class="stat"><b>${dayIn(nextOn('rentEvery'))}</b><span>Rent & mortgages · every ${every('rentEvery')} days</span></div>
        <div class="stat"><b>${dayIn(nextOn('interestEvery'))}</b><span>Interest · every ${every('interestEvery')} days</span></div></div>
        <p class="muted" style="font-size:.85rem">Change how often these happen in Settings.</p></section>
      <section class="panel"><h3>Pay stubs for next payday</h3>${paid.length ? `<div class="tbl-wrap"><table><thead><tr><th>Resident</th><th>Job</th><th class="r">Gross</th><th class="r">Tax ${tr}%</th><th class="r">Take-home</th></tr></thead><tbody>
        ${paid.map(p => { const g = Math.round(p.wage * (100 + Number(S.settings.payBonus || 0)) / 100), t = Math.round(g * tr / 100); return `<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.job || '—')}</td><td class="r num">${money(g)}</td><td class="r num neg">${money(-t)}</td><td class="r num"><b>${money(g - t)}</b></td></tr>`; }).join('')}</tbody></table></div>` : '<div class="empty">Nobody has a wage yet. Set jobs and wages under Residents.</div>'}</section>
    </div><div class="stack">
      <section class="panel"><h3>Town events</h3><p class="muted" style="font-size:.88rem">Prizes, storms, market swings, lost wallets and more. One may happen when you advance the day, or you can draw one now.</p>
        <div><button class="btn" data-act="runNow" data-id="event">Draw an event card</button></div></section>
      <section class="panel"><h3>Unpaid bills</h3><div class="list">${unpaid.length ? unpaid.map(x => `<div class="li"><div class="main"><b>${esc(nameOf(x.playerId))} · ${esc(x.label || 'Utilities')}</b><small>Issued Day ${x.issuedDay} · due Day ${x.dueDay}</small></div><span class="pill ${x.status === 'late' ? 'bad' : 'warn'}">${x.status === 'late' ? 'Late' : 'Due'}</span><span class="amt">${money(x.total)}</span></div>`).join('') : '<div class="empty">Everyone is paid up.</div>'}</div></section>
      <section class="panel"><h3>Run something now</h3><p class="muted" style="font-size:.88rem">For a bonus payday or a surprise bill without changing the day.</p>
        <div class="row"><button class="btn ghost sm" data-act="runNow" data-id="pay">Payday now</button><button class="btn ghost sm" data-act="runNow" data-id="bills">Utility bills now</button><button class="btn ghost sm" data-act="runNow" data-id="interest">Interest now</button></div></section>
    </div></div>`;
  }
  if (S.tab === 'teller') {
    const all = Object.values(S.loans).sort((a, c) => c.at - a.at);
    const req = all.filter(l => l.status === 'requested'), act = all.filter(l => l.status === 'active');
    const waiting = waitingTeller().sort((a, c) => a.at - c.at);
    const mortgages = ps.filter(p => p.home?.mode === 'mortgage'), cds = S.cds.filter(c => c.status === 'open');
    const card = r => {
      const who = esc(nameOf(r.playerId)), c = bal(b, r.playerId, 'c');
      if (r.kind === 'withdraw') return `<div class="shop"><div class="panel-head"><b>${who} wants ${money(r.amount)} in cash</b><span class="pill warn">Withdrawal</span></div><p class="muted">Checking has ${money(c)}. Hand over the play money, then tap Done.</p><div class="row"><button class="btn" data-act="tellerDone" data-id="${r.id}">Done, cash handed over</button><button class="btn ghost" data-act="tellerDecline" data-id="${r.id}">Decline</button></div></div>`;
      if (r.kind === 'deposit') return `<div class="shop"><div class="panel-head"><b>${who} is depositing ${money(r.amount)}</b><span class="pill good">Deposit</span></div><p class="muted">Into ${r.acct === 's' ? 'savings' : 'checking'}. Count the play money, then tap Done.</p><div class="row"><button class="btn" data-act="tellerDone" data-id="${r.id}">Done, cash received</button><button class="btn ghost" data-act="tellerDecline" data-id="${r.id}">Decline</button></div></div>`;
      if (r.kind === 'cd') return `<div class="shop"><div class="panel-head"><b>${who} wants to open a ${money(r.amount)} CD</b><span class="pill note">CD</span></div><p class="muted">Pays ${money(Math.round(r.amount * (100 + cfg('cdRate')) / 100))} in ${every('cdDays')} days. Checking has ${money(c)}.</p><div class="row"><button class="btn" data-act="tellerDone" data-id="${r.id}">Open the CD</button><button class="btn ghost" data-act="tellerDecline" data-id="${r.id}">Decline</button></div></div>`;
      if (r.kind === 'cdclose') { const cd = S.cds.find(x => x.id === r.cdId); return `<div class="shop"><div class="panel-head"><b>${who} wants to cash out a CD early</b><span class="pill bad">Early CD</span></div><p class="muted">${cd ? `Put in ${money(cd.amount)}. With the ${cfg('cdPenalty')}% penalty they get ${money(Math.round(cd.amount * (100 - cfg('cdPenalty')) / 100))}.` : 'That CD is gone.'}</p><div class="row"><button class="btn" data-act="tellerDone" data-id="${r.id}">Cash it out</button><button class="btn ghost" data-act="tellerDecline" data-id="${r.id}">Decline</button></div></div>`; }

        ${cr.score < 580 ? '<p class="neg">Credit score is below 580. You can still approve it, but a real bank would say no.</p>' : ''}
        <div class="row"><button class="btn" data-act="tellerDone" data-id="${r.id}">Approve mortgage</button><button class="btn ghost" data-act="tellerDecline" data-id="${r.id}">Decline</button></div></div>`; }
      return '';
    };
    return `<div class="cols"><div class="stack">
      <section class="panel"><h3>Customers waiting</h3>${waiting.length || req.length ? waiting.map(card).join('') + req.map(l => { const c = credit(l.playerId); return `<div class="shop">
        <div class="panel-head"><b>${esc(nameOf(l.playerId))} wants a ${money(l.amount)} loan</b><span class="pill ${c.band[1]}">Credit ${c.score}</span></div>
        <p class="muted">For: ${esc(l.purpose)} · can borrow up to ${money(c.avail)}</p>
        <form class="inline" data-form="approve" data-id="${l.id}"><label>Interest % every ${every('interestEvery')} days<input id="la-${l.id}" inputmode="decimal" value="${l.rate}"></label>

      ${shops.map(s => { const os = S.orders.filter(o => o.shopId === s.id); return `<tr><td><b>${esc(s.name)}</b><br><small class="muted">${BIZ[bizType(s)].Noun}${salePct(s) ? ' · ' + salePct(s) + '% off' : ''}</small></td><td>${esc(nameOf(s.ownerId))}</td><td class="r num">${money(os.filter(o => o.status !== 'refunded').reduce((a, o) => a + o.total, 0))}</td><td class="r num">${money(sharePrice(s.id))}</td><td class="r">${os.filter(o => o.status === 'new').length}</td><td class="r"><button class="btn danger sm" data-act="closeShop" data-id="${s.id}">Close</button></td></tr>`; }).join('')}
      </tbody></table></div>` : '<div class="empty">No businesses yet. Kids open shops and restaurants from their My businesses tab.</div>'}</section>`;

  if (S.tab === 'settings') {
    const s = S.settings, ut = utilities(), rows = [0, 1, 2, 3].map(i => ut[i] || {name: '', amount: 0}), hs = homes(), hrows = [0, 1, 2, 3].map(i => hs[i] || {name: '', rent: 0, price: 0});

      <section class="panel"><h3>Schedule</h3><div class="fields">

      <section class="panel"><h3>Utility bill</h3><p class="muted" style="font-size:.88rem">Every resident gets this bill. Leave a name blank to drop that line.</p>
